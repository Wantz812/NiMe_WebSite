<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>🎬 CineParty - Birlikdə İzləyin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0a0f;
      --surface: #1a1a24;
      --surface-light: #252534;
      --primary: #6366f1;
      --accent: #f59e0b;
      --success: #10b981;
      --error: #ef4444;
      --text: #ffffff;
      --text-muted: #9ca3af;
      --border: rgba(255,255,255,0.1);
    }

    body { 
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }

    .header {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, var(--primary), #764ba2);
      border-radius: 20px;
      margin-bottom: 30px;
    }

    .logo { font-size: 80px; margin-bottom: 20px; }
    .title { font-size: 48px; font-weight: 900; margin-bottom: 10px; color: white; }
    .subtitle { font-size: 18px; color: rgba(255,255,255,0.9); }

    /* Create Room */
    .createBox {
      background: var(--surface);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid var(--border);
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .boxTitle {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 30px;
      text-align: center;
    }

    .formGroup {
      margin-bottom: 24px;
    }

    .label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .input {
      width: 100%;
      padding: 16px 20px;
      background: var(--surface-light);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--primary), #764ba2);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Poppins', sans-serif;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }

    /* Watch Room */
    .watchRoom {
      display: none;
    }

    .watchRoom.active {
      display: block;
    }

    .watchHeader {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .roomTitle {
      font-size: 28px;
      font-weight: 900;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .actionBtn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Poppins', sans-serif;
    }

    .actionBtn.share {
      background: var(--success);
      color: white;
    }

    .actionBtn.leave {
      background: var(--error);
      color: white;
    }

    .actionBtn:hover {
      transform: translateY(-2px);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    .cardTitle {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Video */
    .sourceTabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 14px;
      background: var(--surface-light);
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }

    .tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .videoWrapper {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      margin-bottom: 20px;
      position: relative;
    }

    .videoWrapper iframe,
    .videoWrapper video {
      width: 100%;
      height: 100%;
      border: none;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .placeholderIcon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .placeholderText {
      font-size: 18px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .controls input {
      flex: 1;
    }

    .loadBtn {
      padding: 14px 24px;
      background: var(--success);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .loadBtn:hover {
      background: #059669;
    }

    /* Chat */
    .chatMessages {
      height: 400px;
      overflow-y: auto;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      background: var(--surface-light);
      border-radius: 12px;
      font-size: 14px;
    }

    .message.own {
      background: var(--primary);
      align-self: flex-end;
      max-width: 70%;
    }

    .messageAuthor {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .message.own .messageAuthor {
      color: rgba(255,255,255,0.8);
    }

    .chatInput {
      display: flex;
      gap: 12px;
    }

    .chatInput input {
      flex: 1;
      padding: 12px 18px;
      background: var(--surface-light);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
    }

    .sendBtn {
      padding: 12px 20px;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .sendBtn:hover {
      background: #4f46e5;
    }

    /* Info Box */
    .infoBox {
      background: linear-gradient(135deg, var(--success), #059669);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    .infoBox strong {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .infoBox code {
      display: inline-block;
      background: rgba(0,0,0,0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-all;
    }

    /* Notification */
    .notification {
      position: fixed;
      top: 24px;
      right: 24px;
      background: var(--surface);
      padding: 16px 24px;
      border-radius: 12px;
      border: 2px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10000;
      transform: translateX(400px);
      transition: transform 0.3s;
    }

    .notification.show {
      transform: translateX(0);
    }

    .notificationIcon {
      font-size: 24px;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--surface-light);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }
  </style>
</head>
<body>

<!-- Notification -->
<div class="notification" id="notification">
  <div class="notificationIcon" id="notificationIcon">✅</div>
  <div class="notificationText" id="notificationText"></div>
</div>

<div class="container">
  <!-- Home Screen -->
  <div id="homeScreen">
    <div class="header">
      <div class="logo">🎬</div>
      <div class="title">CineParty</div>
      <div class="subtitle">Sevgilinizlə birlikdə film izləyin - REAL işləyir!</div>
    </div>

    <div class="createBox">
      <div class="boxTitle">🎬 Yeni Otaq Yarat</div>
      
      <div class="formGroup">
        <label class="label">Sizin adınız</label>
        <input type="text" class="input" id="hostName" placeholder="Adınızı yazın" maxlength="20">
      </div>

      <div class="formGroup">
        <label class="label">Otaq adı</label>
        <input type="text" class="input" id="roomName" placeholder="Məsələn: Film Gecəsi" maxlength="30">
      </div>

      <div class="formGroup">
        <label class="label">Şifrə (istəyə bağlı)</label>
        <input type="password" class="input" id="roomPassword" placeholder="Şifrə qoyun və ya boş buraxın" maxlength="20">
      </div>

      <button class="btn" onclick="createRoom()">
        🎬 Otaq Yarat və Sevgilinə Göndər
      </button>
    </div>
  </div>

  <!-- Watch Room -->
  <div class="watchRoom" id="watchRoom">
    <div class="watchHeader">
      <div class="roomTitle" id="roomTitleDisplay">🎬 Film Otağı</div>
      <div class="actions">
        <button class="actionBtn share" onclick="shareRoom()">📤 Linki Kopyala</button>
        <button class="actionBtn leave" onclick="leaveRoom()">🚪 Çıx</button>
      </div>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <div class="cardTitle">📺 Video Player</div>

          <div class="sourceTabs">
            <div class="tab active" onclick="selectSource('youtube')" id="youtubeTab">
              📺 YouTube
            </div>
            <div class="tab" onclick="selectSource('screen')" id="screenTab">
              🖥️ Ekran Paylaş
            </div>
          </div>

          <div class="videoWrapper" id="videoWrapper">
            <div class="placeholder">
              <div class="placeholderIcon">🎬</div>
              <div class="placeholderText">Mənbə seçin</div>
            </div>
          </div>

          <div class="controls" id="youtubeControls">
            <input type="text" class="input" id="videoUrl" placeholder="YouTube linki yapışdırın">
            <button class="loadBtn" onclick="loadVideo()">▶️ Yüklə</button>
          </div>

          <div class="controls" id="screenControls" style="display: none;">
            <button class="btn" onclick="shareScreen()">🖥️ Ekran Paylaşımını Başlat</button>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="cardTitle">💬 Söhbət</div>
          <div class="chatMessages" id="chatMessages">
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">
              💬 Buradan mesajlaşın!
            </div>
          </div>
          <div class="chatInput">
            <input type="text" class="input" id="chatInput" placeholder="Mesaj yazın...">
            <button class="sendBtn" onclick="sendMessage()">📤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentSource = 'youtube';
  let username = '';
  let roomData = null;

  // Check URL on load
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const roomName = params.get('room');
    const videoId = params.get('v');
    const password = params.get('pwd');

    if (roomName) {
      // Joining existing room
      const name = prompt('Adınızı daxil edin:');
      if (!name) {
        alert('❌ Ad daxil etməlisiniz!');
        window.location.href = window.location.pathname;
        return;
      }

      if (password) {
        const enteredPwd = prompt('🔐 Şifrə daxil edin:');
        if (enteredPwd !== password) {
          alert('❌ Şifrə yanlışdır!');
          window.location.href = window.location.pathname;
          return;
        }
      }

      username = name;
      roomData = {
        name: decodeURIComponent(roomName),
        password: password
      };

      document.getElementById('homeScreen').style.display = 'none';
      document.getElementById('watchRoom').classList.add('active');
      document.getElementById('roomTitleDisplay').textContent = '🎬 ' + roomData.name;

      if (videoId) {
        document.getElementById('videoUrl').value = 'https://youtube.com/watch?v=' + videoId;
        loadVideo();
      }

      showNotification('✅ Otağa qoşuldunuz!', '🎉');
      addMessage(`${username} otağa qoşuldu! 👋`, 'Sistem');
    }

    // Enter key listeners
    document.getElementById('chatInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('videoUrl').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadVideo();
    });
  });

  function createRoom() {
    const hostNameInput = document.getElementById('hostName');
    const roomNameInput = document.getElementById('roomName');
    const passwordInput = document.getElementById('roomPassword');

    const hostName = hostNameInput.value.trim();
    const roomName = roomNameInput.value.trim();
    const password = passwordInput.value.trim();

    if (!hostName) {
      showNotification('⚠️ Adınızı daxil edin!', '❌');
      return;
    }

    if (!roomName) {
      showNotification('⚠️ Otaq adı daxil edin!', '❌');
      return;
    }

    username = hostName;
    roomData = {
      name: roomName,
      password: password
    };

    // Build URL
    let url = window.location.origin + window.location.pathname;
    url += '?room=' + encodeURIComponent(roomName);
    if (password) {
      url += '&pwd=' + encodeURIComponent(password);
    }

    // Copy to clipboard
    navigator.clipboard.writeText(url).then(() => {
      alert('✅ OTAQ YARADILDI!\n\n📋 Link kopyalandı!\n\nİndi bu linki sevgilinizə göndərin:\n\n' + url + '\n\n' + (password ? '🔐 Şifrə: ' + password : ''));
    }).catch(() => {
      prompt('Link kopyalana bilmədi. Manuel kopyalayın:', url);
    });

    // Show watch room
    document.getElementById('homeScreen').style.display = 'none';
    document.getElementById('watchRoom').classList.add('active');
    document.getElementById('roomTitleDisplay').textContent = '🎬 ' + roomName;

    showNotification('✅ Otaq yaradıldı! Linki sevgilinizə göndərin!', '🎉');
    addMessage(`${username} otağı yaratdı! 🎬`, 'Sistem');
  }

  function selectSource(source) {
    currentSource = source;
    
    document.getElementById('youtubeTab').classList.toggle('active', source === 'youtube');
    document.getElementById('screenTab').classList.toggle('active', source === 'screen');
    
    document.getElementById('youtubeControls').style.display = source === 'youtube' ? 'flex' : 'none';
    document.getElementById('screenControls').style.display = source === 'screen' ? 'flex' : 'none';

    const wrapper = document.getElementById('videoWrapper');
    wrapper.innerHTML = `
      <div class="placeholder">
        <div class="placeholderIcon">${source === 'youtube' ? '📺' : '🖥️'}</div>
        <div class="placeholderText">${source === 'youtube' ? 'YouTube linki daxil edin' : 'Ekran paylaşımını başladın'}</div>
      </div>
    `;
  }

  function loadVideo() {
    const input = document.getElementById('videoUrl');
    const url = input.value.trim();

    if (!url) {
      showNotification('⚠️ YouTube linki daxil edin!', '❌');
      return;
    }

    let videoId = '';
    if (url.includes('youtube.com/watch?v=')) {
      videoId = url.split('v=')[1]?.split('&')[0];
    } else if (url.includes('youtu.be/')) {
      videoId = url.split('youtu.be/')[1]?.split('?')[0];
    } else if (url.includes('youtube.com/embed/')) {
      videoId = url.split('embed/')[1]?.split('?')[0];
    }

    if (!videoId) {
      showNotification('⚠️ Düzgün YouTube linki deyil!', '❌');
      return;
    }

    const wrapper = document.getElementById('videoWrapper');
    wrapper.innerHTML = `
      <iframe 
        src="https://www.youtube.com/embed/${videoId}?autoplay=0" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen
      ></iframe>
    `;

    // Update URL to include video
    const params = new URLSearchParams(window.location.search);
    params.set('v', videoId);
    const newUrl = window.location.pathname + '?' + params.toString();
    window.history.replaceState({}, '', newUrl);

    showNotification('✅ Video yükləndi!', '🎬');
    addMessage(`${username} video yüklədi: ${videoId}`, 'Sistem');
  }

  async function shareScreen() {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: { cursor: 'always' },
        audio: true
      });

      const wrapper = document.getElementById('videoWrapper');
      wrapper.innerHTML = '';

      const video = document.createElement('video');
      video.srcObject = stream;
      video.autoplay = true;
      video.muted = false;
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.objectFit = 'contain';

      wrapper.appendChild(video);

      showNotification('✅ Ekran paylaşımı başladı!', '🖥️');
      addMessage(`${username} ekran paylaşır 🖥️`, 'Sistem');

      stream.getVideoTracks()[0].onended = () => {
        showNotification('📺 Ekran paylaşımı dayandırıldı', '⏹️');
        wrapper.innerHTML = `
          <div class="placeholder">
            <div class="placeholderIcon">🖥️</div>
            <div class="placeholderText">Ekran paylaşımını başladın</div>
          </div>
        `;
      };
    } catch (err) {
      showNotification('❌ Ekran paylaşımı xətası!', '⚠️');
      console.error(err);
    }
  }

  function shareRoom() {
    const url = window.location.href;
    navigator.clipboard.writeText(url).then(() => {
      alert('✅ LINK KOPYALANDI!\n\nSevgilinizə göndərin:\n\n' + url + '\n\n' + (roomData.password ? '🔐 Şifrə: ' + roomData.password : ''));
      showNotification('✅ Link kopyalandı!', '📋');
    }).catch(() => {
      prompt('Link:', url);
    });
  }

  function leaveRoom() {
    if (confirm('Otaqdan çıxmaq istədiyinizdən əminsiniz?')) {
      window.location.href = window.location.pathname;
    }
  }

  function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, username, true);
    input.value = '';
  }

  function addMessage(text, author, isOwn = false) {
    const messagesDiv = document.getElementById('chatMessages');
    
    if (messagesDiv.children.length === 1 && messagesDiv.children[0].textContent.includes('💬')) {
      messagesDiv.innerHTML = '';
    }

    const messageEl = document.createElement('div');
    messageEl.className = 'message' + (isOwn ? ' own' : '');
    
    messageEl.innerHTML = `
      <div class="messageAuthor">${author}</div>
      <div>${text}</div>
    `;

    messagesDiv.appendChild(messageEl);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showNotification(text, icon = '✅') {
    const notification = document.getElementById('notification');
    document.getElementById('notificationText').textContent = text;
    document.getElementById('notificationIcon').textContent = icon;

    notification.classList.add('show');
    setTimeout(() => {
      notification.classList.remove('show');
    }, 3500);
  }
</script>

</body>
</html>
