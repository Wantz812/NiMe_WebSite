<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CineParty Mobile</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #1a1a24;
      --surface-light: #252534;
      --primary: #6366f1;
      --accent: #f59e0b;
      --success: #10b981;
      --error: #ef4444;
      --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- LOBBY --- */
    #lobby-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      z-index: 100;
      padding: 20px;
    }

    .lobby-card {
      background: var(--surface);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .lobby-title { font-size: 28px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
    .lobby-desc { color: #aaa; margin-bottom: 25px; font-size: 14px; }

    .btn {
      width: 100%; padding: 15px; border-radius: 12px; border: none;
      font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--surface-light); color: white; }
    
    /* Məcburi Keçid Düyməsi (Gizli) */
    #force-enter-btn {
        display: none;
        background: var(--accent);
        color: black;
        animation: pulse 1s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

    input.code-input {
      width: 100%; padding: 15px; background: #111; border: 1px solid #333;
      border-radius: 10px; color: white; margin-bottom: 15px; text-align: center;
      font-size: 18px; outline: none;
    }

    .code-display {
      background: #111; padding: 15px; border-radius: 10px; border: 1px dashed var(--accent);
      color: var(--accent); font-family: monospace; font-size: 22px; margin-bottom: 15px; word-break: break-all;
    }

    /* --- ROOM --- */
    #room-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .video-area {
      flex: 3; /* Video daha böyük olsun */
      background: black;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%; height: 100%; object-fit: contain;
    }

    /* Mobil üçün Play Button Overlay */
    #play-overlay {
        position: absolute; inset: 0; background: rgba(0,0,0,0.7);
        display: none; align-items: center; justify-content: center; z-index: 20;
    }
    #play-overlay button {
        background: var(--primary); color: white; border: none;
        padding: 20px 40px; border-radius: 50px; font-size: 18px; font-weight: bold;
    }

    .controls {
      position: absolute; bottom: 15px; right: 15px; left: 15px;
      display: flex; justify-content: center; gap: 15px; z-index: 10;
    }
    
    .ctrl-btn {
      width: 45px; height: 45px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.2); color: white; font-size: 18px;
      backdrop-filter: blur(5px);
    }
    .ctrl-btn.active { background: var(--success); }
    .ctrl-btn.danger { background: var(--error); }

    .chat-area {
      flex: 2; /* Çat sahəsi */
      background: var(--surface);
      display: flex; flex-direction: column;
      border-top: 1px solid #333;
    }

    .messages {
      flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg { padding: 8px 12px; border-radius: 10px; font-size: 14px; max-width: 85%; }
    .msg.mine { background: var(--primary); align-self: flex-end; }
    .msg.theirs { background: var(--surface-light); align-self: flex-start; }
    .msg.sys { text-align: center; color: #888; font-size: 12px; align-self: center; background: none; }

    .input-box {
      padding: 10px; background: var(--surface-light); display: flex; gap: 10px;
    }
    .input-box input {
      flex: 1; padding: 10px; border-radius: 20px; border: none; background: var(--surface); color: white; outline: none;
    }
    .input-box button {
      width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--primary); color: white;
    }
  </style>
</head>
<body>

  <div id="lobby-screen">
    <div class="lobby-card" id="start-menu">
      <div class="lobby-title">🎬 CineParty</div>
      <div class="lobby-desc">Kompüter və Telefon arası əlaqə</div>
      <button class="btn btn-primary" onclick="showCreate()">Otaq Yarat (Kompüter)</button>
      <button class="btn btn-secondary" onclick="showJoin()">Otağa Qoşul (Telefon)</button>
    </div>

    <div class="lobby-card" id="create-menu" style="display:none;">
      <div class="lobby-desc">Bu kodu telefona yaz:</div>
      <div class="code-display" id="my-id">Yüklənir...</div>
      <div id="status-text" style="font-size: 12px; color: #aaa;">Gözlənilir...</div>
      <button class="btn btn-secondary" onclick="location.reload()">Geri</button>
    </div>

    <div class="lobby-card" id="join-menu" style="display:none;">
      <input type="text" id="join-code" class="code-input" placeholder="Kodu bura yaz">
      <button class="btn btn-primary" id="join-btn" onclick="joinRoom()">Qoşul</button>
      
      <button id="force-enter-btn" class="btn" onclick="forceEnterRoom()">
         ⚠️ Otağa Zorla Gir
      </button>
      
      <button class="btn btn-secondary" onclick="location.reload()">Geri</button>
    </div>
  </div>

  <div id="room-screen">
    <div class="video-area">
      <video id="remote-video" playsinline autoplay></video>
      
      <div id="play-overlay">
         <button onclick="unlockAudio()">🔊 Videonu Başlat</button>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="screen-btn" onclick="shareScreen()"><i class="fas fa-desktop"></i></button>
        <button class="ctrl-btn" onclick="toggleMute()"><i class="fas fa-volume-up" id="mute-icon"></i></button>
        <button class="ctrl-btn danger" onclick="location.reload()"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>

    <div class="chat-area">
      <div class="messages" id="chat-box">
         <div class="msg sys">Otağa xoş gəldiniz!</div>
      </div>
      <div class="input-box">
        <input type="text" id="msg-in" placeholder="Mesaj..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    // --- GÜCLÜ SERVER KONFİQURASİYASI (STUN) ---
    // Bu hissə mobil şəbəkə problemlərini həll edir
    const peerConfig = {
      debug: 2,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    };

    let peer = new Peer(null, peerConfig);
    let conn = null;
    let myStream = null;

    // --- ID YARADILMASI ---
    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
    });

    // --- VİDEO QƏBULU (Telefonda baxan üçün) ---
    peer.on('call', (call) => {
      call.answer(); // Gələn zəngi birbaşa aç
      
      // Otağa keçid edək
      enterRoom();

      call.on('stream', (stream) => {
        const video = document.getElementById('remote-video');
        video.srcObject = stream;
        
        // Mobil üçün video hazır olanda
        video.onloadedmetadata = () => {
            video.play().catch(e => {
                // Əgər avtomatik açılmasa, düyməni göstər
                console.log("Autoplay bloklandı, düymə çıxarılır...");
                document.getElementById('play-overlay').style.display = 'flex';
            });
        };
      });
    });

    // --- ƏLAQƏ QURULMASI (Çat üçün) ---
    peer.on('connection', (c) => {
      conn = c;
      setupConn();
      enterRoom();
      addMsg("Digər istifadəçi qoşuldu!", 'sys');
    });

    // --- FUNKSİYALAR ---

    function showCreate() {
      document.getElementById('start-menu').style.display = 'none';
      document.getElementById('create-menu').style.display = 'block';
    }

    function showJoin() {
      document.getElementById('start-menu').style.display = 'none';
      document.getElementById('join-menu').style.display = 'block';
    }

    function joinRoom() {
      const code = document.getElementById('join-code').value.trim();
      if(!code) return alert("Kodu yaz!");

      const btn = document.getElementById('join-btn');
      btn.innerText = "Qoşulur...";
      btn.disabled = true;

      // 5 saniyə sonra hələ də girməyibsə, "Zorla Gir" düyməsini çıxar
      setTimeout(() => {
          document.getElementById('force-enter-btn').style.display = 'flex';
      }, 4000);

      conn = peer.connect(code);

      conn.on('open', () => {
        setupConn();
        enterRoom();
      });
      
      conn.on('error', (err) => alert("Xəta: " + err));
    }

    function forceEnterRoom() {
        enterRoom();
        alert("Otağa zorla keçid edildi. Video gəlmirsə, qarşı tərəf 'Ekran Paylaş' düyməsinə yenidən bassın.");
    }

    function setupConn() {
      conn.on('data', (data) => {
        if(data.type === 'chat') addMsg(data.msg, 'theirs');
      });
      conn.on('close', () => location.reload());
    }

    function enterRoom() {
      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('room-screen').style.display = 'flex';
    }

    // Mobil üçün səsi aktivləşdirmək
    function unlockAudio() {
        const video = document.getElementById('remote-video');
        video.muted = false;
        video.play();
        document.getElementById('play-overlay').style.display = 'none';
    }

    // --- EKRAN PAYLAŞIMI (Yalnız Kompüterdə işləyir) ---
    async function shareScreen() {
      try {
        myStream = await navigator.mediaDevices.getDisplayMedia({ 
            video: { cursor: "always" }, 
            audio: true 
        });
        
        document.getElementById('remote-video').srcObject = myStream;
        document.getElementById('remote-video').muted = true; // Öz səsimizi eşitməyək

        if(conn) {
          peer.call(conn.peer, myStream);
        }
        
        document.getElementById('screen-btn').classList.add('active');
        
        // Paylaşım bitəndə
        myStream.getVideoTracks()[0].onended = () => {
             document.getElementById('screen-btn').classList.remove('active');
        };

      } catch (err) {
        console.error(err);
      }
    }

    // --- ÇAT VƏ SƏS ---
    function sendMsg() {
      const input = document.getElementById('msg-in');
      const txt = input.value.trim();
      if(txt && conn) {
        conn.send({ type: 'chat', msg: txt });
        addMsg(txt, 'mine');
        input.value = '';
      }
    }

    function addMsg(txt, type) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = txt;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function toggleMute() {
        const video = document.getElementById('remote-video');
        video.muted = !video.muted;
        document.getElementById('mute-icon').className = video.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
    }
  </script>
</body>
</html>
