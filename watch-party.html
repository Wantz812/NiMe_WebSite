<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CineParty: Birlikdə İzlə</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root { --bg: #0f1014; --panel: #1b1d25; --primary: #e50914; --text: #fff; --accent: #46d369; }
    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
    body { background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* LOBBY */
    #lobby { position: fixed; inset: 0; z-index: 999; background: #000 url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat; display: flex; align-items: center; justify-content: center; }
    #lobby::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
    
    .card { position: relative; width: 90%; max-width: 400px; background: rgba(27, 29, 37, 0.95); padding: 2rem; border-radius: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
    .logo { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 20px; letter-spacing: 1px; }
    .btn { width: 100%; padding: 14px; margin-top: 10px; border-radius: 10px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .btn-red { background: var(--primary); color: white; }
    .btn-red:hover { background: #b2070f; }
    .btn-gray { background: #333; color: white; }
    .btn-gray:hover { background: #444; }
    
    .room-code-display { background: #000; padding: 15px; border-radius: 10px; border: 1px dashed #555; font-family: monospace; font-size: 24px; letter-spacing: 2px; color: var(--accent); margin: 15px 0; cursor: pointer; user-select: all; }
    .copy-hint { font-size: 12px; color: #aaa; margin-bottom: 15px; }
    input { width: 100%; padding: 15px; background: #111; border: 1px solid #333; border-radius: 10px; color: white; text-align: center; font-size: 18px; margin-bottom: 10px; }

    /* ROOM UI */
    #room-ui { display: none; flex-direction: column; height: 100%; width: 100%; }
    
    /* VIDEO AREA */
    .cinema-mode { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; max-height: 80vh; }
    
    /* Mobile Overlay for Audio */
    #start-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #start-overlay button { padding: 15px 30px; font-size: 18px; border-radius: 50px; border: none; background: var(--accent); color: #000; font-weight: bold; cursor: pointer; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    /* CONTROLS */
    .controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 20; padding: 10px 20px; background: rgba(0,0,0,0.6); border-radius: 30px; backdrop-filter: blur(5px); }
    .c-btn { width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; color: white; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .btn-share { background: #333; }
    .btn-share.active { background: var(--accent); color: #000; }
    .btn-leave { background: var(--primary); }

    /* CHAT AREA */
    .chat-container { height: 35vh; background: var(--panel); display: flex; flex-direction: column; border-top: 1px solid #333; }
    .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
    .msg.other { align-self: flex-start; background: #333; color: white; border-bottom-left-radius: 2px; }
    .msg.sys { align-self: center; background: transparent; color: #888; font-size: 12px; text-align: center; padding: 5px; }
    
    .chat-input { padding: 10px; background: #111; display: flex; gap: 10px; align-items: center; }
    .chat-input input { margin: 0; text-align: left; padding: 12px; font-size: 14px; }
    .chat-input button { width: 50px; height: 50px; border-radius: 10px; background: var(--primary); color: white; border: none; cursor: pointer; }

    /* Responsive for PC vs Mobile */
    @media (min-width: 768px) {
      #room-ui { flex-direction: row; }
      .cinema-mode { flex: 3; height: 100vh; }
      video { max-height: 100vh; }
      .chat-container { width: 350px; height: 100vh; border-top: none; border-left: 1px solid #333; }
    }
  </style>
</head>
<body>

  <div id="lobby">
    <div class="card" id="menu-main">
      <div class="logo"><i class="fas fa-film"></i> CineParty</div>
      <p style="color:#ccc; margin-bottom:20px;">Sevgilinlə və dostlarınla eyni anda film izlə.</p>
      <button class="btn btn-red" onclick="createRoom()">🎬 Otaq Yarat</button>
      <button class="btn btn-gray" onclick="showJoin()">👋 Otağa Qoşul</button>
    </div>

    <div class="card" id="menu-create" style="display:none;">
      <div class="logo">Otaq Hazırdır!</div>
      <p style="font-size:14px; color:#ccc;">Bu linki və ya kodu dostlarına göndər:</p>
      
      <div class="room-code-display" id="my-id" onclick="copyLink()">...</div>
      <p class="copy-hint" id="copy-text">Kodu kopyalamaq üçün üzərinə toxun</p>
      
      <button class="btn btn-accent" style="background:var(--accent); color:black" onclick="copyLink()">🔗 Linki Kopyala</button>
      <button class="btn btn-red" onclick="enterRoomAsHost()">Otağa Daxil Ol</button>
      <button class="btn btn-gray" onclick="location.reload()">Geri</button>
    </div>

    <div class="card" id="menu-join" style="display:none;">
      <div class="logo">Qoşul</div>
      <input type="text" id="join-input" placeholder="Otaq Kodu">
      <button class="btn btn-red" id="btn-connect" onclick="joinRoom()">Qoşul</button>
      <button class="btn btn-gray" onclick="location.reload()">Geri</button>
    </div>
  </div>

  <div id="room-ui">
    <div class="cinema-mode">
      <video id="remote-video" playsinline autoplay></video>

      <div id="start-overlay" style="display:none">
        <button onclick="enableAudio()"><i class="fas fa-play"></i> SƏSİ AÇ & BAŞLA</button>
        <p style="margin-top:10px; font-size:12px; color:#ccc;">(Telefonda səs üçün vacibdir)</p>
      </div>

      <div class="controls">
        <button class="c-btn btn-share" id="share-btn" onclick="toggleScreenShare()" title="Ekran Paylaş">
          <i class="fas fa-desktop"></i>
        </button>
        <button class="c-btn" onclick="toggleMute()" title="Səsi Bağla/Aç">
          <i class="fas fa-volume-up" id="vol-icon"></i>
        </button>
        <button class="c-btn btn-leave" onclick="location.href=location.pathname" title="Çıxış">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <div class="chat-container">
      <div class="messages" id="chat-box">
        <div class="msg sys">Xoş gəldiniz! ❤️<br>Ekranı PC-dən paylaşmaq məsləhətdir.</div>
      </div>
      <div class="chat-input">
        <input type="text" id="msg-in" placeholder="Mesaj yaz..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const generateID = () => Math.floor(100000 + Math.random() * 900000).toString(); // 6 rəqəmli sadə kod
    let myPeerId = null;
    let peer = null;
    let myStream = null;
    let connections = []; // Bütün qoşulanların siyahısı (Chat üçün)
    let isHost = false;

    // URL Parametrindən otaq kodunu yoxla (Linklə giriş üçün)
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomCode = urlParams.get('room');
      if (roomCode) {
        showJoin();
        document.getElementById('join-input').value = roomCode;
      }
    };

    // --- LOBBY LOGIC ---
    function createRoom() {
      myPeerId = generateID();
      initPeer(myPeerId);
      document.getElementById('menu-main').style.display = 'none';
      document.getElementById('menu-create').style.display = 'block';
      document.getElementById('my-id').innerText = myPeerId;
      isHost = true;
    }

    function showJoin() {
      document.getElementById('menu-main').style.display = 'none';
      document.getElementById('menu-join').style.display = 'block';
    }

    function joinRoom() {
      const roomId = document.getElementById('join-input').value.trim();
      if (!roomId) return alert("Zəhmət olmasa kodu daxil edin!");
      
      document.getElementById('btn-connect').innerText = "Qoşulur...";
      // Qonaq üçün random ID yaradaq
      initPeer(null, roomId);
    }

    function enterRoomAsHost() {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('room-ui').style.display = 'flex';
      addSystemMessage("Otaq yaradıldı. 'Ekran Paylaş' düyməsi ilə filmi başlat.");
    }

    function copyLink() {
      const link = `${window.location.origin}${window.location.pathname}?room=${myPeerId}`;
      navigator.clipboard.writeText(link).then(() => {
        document.getElementById('copy-text').innerText = "Link kopyalandı! Dostuna göndər.";
        document.getElementById('copy-text').style.color = "#46d369";
      });
    }

    // --- PEERJS LOGIC ---
    function initPeer(id, connectToId = null) {
      peer = new Peer(id, {
        debug: 1,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] }
      });

      peer.on('open', (id) => {
        console.log('My ID:', id);
        if (connectToId) {
          connectToHost(connectToId);
        }
      });

      // Biri bizə qoşulanda (Host və ya Qonaq) - DATA (Chat)
      peer.on('connection', (conn) => {
        connections.push(conn);
        setupConnection(conn);
        
        // Əgər Hostuqsa və ekran paylaşırıqsa, yeni gələnə dərhal videonu ataq
        if (isHost && myStream) {
          peer.call(conn.peer, myStream);
        }
      });

      // Biri bizə zəng edəndə (Video Stream)
      peer.on('call', (call) => {
        call.answer(); // Cavab veririk
        
        call.on('stream', (remoteStream) => {
          const video = document.getElementById('remote-video');
          video.srcObject = remoteStream;
          
          // Mobile Policy: Video gəldi, amma play etmək üçün düymə göstər
          document.getElementById('start-overlay').style.display = 'flex';
        });
      });

      peer.on('error', (err) => {
        alert("Xəta baş verdi: " + err.type);
        location.reload();
      });
    }

    function connectToHost(hostId) {
      const conn = peer.connect(hostId);
      connections.push(conn);
      setupConnection(conn);
      
      conn.on('open', () => {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('room-ui').style.display = 'flex';
        addSystemMessage("Otağa qoşuldunuz! Yayımı gözləyin...");
      });
    }

    function setupConnection(conn) {
      conn.on('data', (data) => {
        if (data.type === 'msg') {
          addMessage(data.user, data.text, 'other');
        }
      });
      conn.on('close', () => {
        addSystemMessage("Bir nəfər ayrıldı.");
        connections = connections.filter(c => c !== conn);
      });
      conn.on('open', () => {
        if(isHost) addSystemMessage("Yeni izləyici qoşuldu!");
      });
    }

    // --- SCREEN SHARE (HOST ONLY) ---
    async function toggleScreenShare() {
      if (!isHost) {
        alert("Yalnız otaq sahibi ekran paylaşa bilər!");
        return;
      }

      if (myStream) {
        // Stop sharing
        myStream.getTracks().forEach(track => track.stop());
        myStream = null;
        document.getElementById('share-btn').classList.remove('active');
        document.getElementById('remote-video').srcObject = null;
        addSystemMessage("Yayım dayandırıldı.");
        return;
      }

      try {
        // Səs ilə birlikdə ekran paylaşımı istəyirik
        myStream = await navigator.mediaDevices.getDisplayMedia({ 
          video: { cursor: "always" }, 
          audio: { 
            echoCancellation: false, 
            noiseSuppression: false, 
            autoGainControl: false 
          } 
        });

        // Host özü də görsün nə paylaşır (Səssiz)
        const v = document.getElementById('remote-video');
        v.srcObject = myStream;
        v.muted = true; 
        v.play();

        document.getElementById('share-btn').classList.add('active');
        addSystemMessage("Yayım başladı! Səs üçün 'Share Audio' seçdiyinə əmin ol.");

        // Bütün qoşulu istifadəçilərə zəng et
        connections.forEach(conn => {
          peer.call(conn.peer, myStream);
        });

        // Yayım dayananda (browser UI-dan stop edəndə)
        myStream.getVideoTracks()[0].onended = () => {
            myStream = null;
            document.getElementById('share-btn').classList.remove('active');
            addSystemMessage("Yayım dayandırıldı.");
        };

      } catch (err) {
        console.error("Screen Share Error:", err);
        alert("Ekran paylaşımı ləğv edildi və ya dəstəklənmir.");
      }
    }

    // --- VIDEO CONTROLS ---
    function enableAudio() {
      const v = document.getElementById('remote-video');
      v.muted = false;
      v.play()
        .then(() => {
          document.getElementById('start-overlay').style.display = 'none';
        })
        .catch(e => alert("Xəta: Ekrana toxun sonra yenidən cəhd et."));
    }

    function toggleMute() {
      const v = document.getElementById('remote-video');
      v.muted = !v.muted;
      document.getElementById('vol-icon').className = v.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
    }

    // --- CHAT FUNCTIONS ---
    function sendMessage() {
      const input = document.getElementById('msg-in');
      const text = input.value.trim();
      if (!text) return;

      // Özümüzə göstərək
      addMessage("Mən", text, 'me');

      // Hamıya göndərək
      connections.forEach(conn => {
        if(conn.open) {
          conn.send({ type: 'msg', user: isHost ? 'Host' : 'Qonaq', text: text });
        }
      });

      input.value = '';
    }

    function addMessage(user, text, type) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerHTML = `<strong>${user}:</strong> ${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function addSystemMessage(text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'msg sys';
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function handleEnter(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
