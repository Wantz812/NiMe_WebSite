<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CineParty: Sevgilinlə İzlə</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">

  <style>
    :root { 
      --bg: #09090b; 
      --glass: rgba(255, 255, 255, 0.05);
      --primary: #e50914; 
      --text: #fff; 
      --accent: #46d369; 
    }
    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; font-family: 'Outfit', sans-serif; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      height: 100vh; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
    }

    /* --- INTRO ANIMATION --- */
    #intro-layer {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 1s ease;
    }
    .intro-logo {
      font-size: 4rem; font-weight: 800; color: var(--primary);
      text-transform: uppercase; letter-spacing: 5px;
      animation: zoomIn 2s ease forwards;
      text-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
    }
    @keyframes zoomIn {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* --- LOBBY STYLES --- */
    #lobby { 
      position: fixed; inset: 0; z-index: 100; 
      background: radial-gradient(circle at center, #1a1c29 0%, #000 100%);
      display: flex; align-items: center; justify-content: center; 
    }
    
    .card { 
      width: 90%; max-width: 420px; 
      background: rgba(20, 20, 20, 0.8); 
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 2.5rem; border-radius: 24px; text-align: center; 
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 50px rgba(229, 9, 20, 0.15);
      animation: fadeInUp 0.8s ease;
    }
    @keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .logo-text { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .sub-text { color: #888; margin-bottom: 30px; font-size: 14px; }

    input { 
      width: 100%; padding: 16px; background: rgba(255,255,255,0.05); 
      border: 1px solid #333; border-radius: 12px; color: white; 
      text-align: center; font-size: 16px; margin-bottom: 15px; 
      transition: 0.3s;
    }
    input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

    .btn { 
      width: 100%; padding: 16px; border-radius: 12px; border: none; 
      font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; 
      display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;
    }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); }
    .btn-primary:hover { background: #ff0f1f; transform: translateY(-2px); }
    .btn-secondary { background: #333; color: white; }
    .btn-secondary:hover { background: #444; }

    .room-code { 
      font-family: monospace; font-size: 32px; letter-spacing: 5px; 
      color: var(--accent); margin: 20px 0; font-weight: bold; cursor: pointer;
    }

    /* --- PLAYER UI --- */
    #room-ui { display: none; height: 100%; width: 100%; position: relative; overflow: hidden; }

    /* Video Wrapper - handles fullscreen */
    .video-wrapper {
      flex: 1; position: relative; background: #000; 
      display: flex; align-items: center; justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* Floating Chat Overlay */
    .chat-overlay {
      position: absolute; right: 20px; top: 20px; bottom: 100px; width: 300px;
      pointer-events: none; /* Klikləri videoya buraxır, amma mesajlara yox */
      display: flex; flex-direction: column; justify-content: flex-end;
      z-index: 50;
      transition: 0.3s;
    }
    .chat-overlay.hidden { opacity: 0; }

    /* Messages in Overlay */
    .messages-container {
      overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
      padding: 10px; mask-image: linear-gradient(to top, black 80%, transparent 100%);
      pointer-events: auto; /* Mesajları sürüşdürmək olsun */
    }
    .msg { 
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
      padding: 8px 12px; border-radius: 8px; font-size: 14px; 
      color: #ddd; width: fit-content; max-width: 100%;
      animation: slideIn 0.3s ease; text-shadow: 0 1px 2px black;
    }
    .msg b { color: var(--primary); }
    .msg.sys { background: transparent; color: var(--accent); font-size: 12px; align-self: center; }

    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Input Bar (Floating) */
    .chat-bar {
      position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 600px; display: flex; gap: 10px; z-index: 60;
      opacity: 0; transition: 0.3s; pointer-events: none;
    }
    .video-wrapper:hover .chat-bar, .chat-bar:focus-within { opacity: 1; pointer-events: auto; }

    .chat-input {
      flex: 1; padding: 12px 20px; border-radius: 30px; border: none;
      background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(10px);
      color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .chat-send {
      width: 45px; height: 45px; border-radius: 50%; border: none;
      background: var(--primary); color: white; cursor: pointer;
    }

    /* Controls Bar */
    .controls-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 15px; padding: 10px 25px; border-radius: 50px;
      background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(10px);
      z-index: 70; opacity: 0; transition: 0.3s;
    }
    .video-wrapper:hover .controls-bar { opacity: 1; }
    
    .c-btn {
      background: transparent; border: none; color: white; font-size: 20px;
      cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; transition: 0.2s;
    }
    .c-btn:hover { background: rgba(255,255,255,0.2); }
    .c-btn.active { color: var(--accent); }

    /* Mobile Adjustments */
    @media (max-width: 768px) {
      .chat-overlay { right: 10px; left: 10px; width: auto; bottom: 160px; }
      .chat-bar { bottom: 100px; width: 95%; }
      .controls-bar { opacity: 1; bottom: 30px; }
    }
  </style>
</head>
<body>

  <div id="intro-layer">
    <div class="intro-logo">CINEPARTY</div>
  </div>

  <div id="lobby">
    <div class="card" id="menu-main">
      <div class="logo-text"><i class="fas fa-film"></i> CINEPARTY</div>
      <p class="sub-text">Sevgilinlə eyni anda film izlə, eyni hissləri yaşa.</p>
      
      <input type="text" id="username" placeholder="Adın nədir?" maxlength="12">

      <button class="btn btn-primary" onclick="createRoom()">
        <i class="fas fa-plus-circle"></i> Otaq Yarat
      </button>
      <button class="btn btn-secondary" onclick="showJoin()">
        <i class="fas fa-sign-in-alt"></i> Otağa Qoşul
      </button>
    </div>

    <div class="card" id="menu-create" style="display:none;">
      <div class="logo-text">Hazırdır!</div>
      <p class="sub-text">Bu kodu sevgilinə göndər:</p>
      <div class="room-code" id="display-code" onclick="copyCode()">...</div>
      <button class="btn btn-primary" onclick="enterRoom()">
        <i class="fas fa-play"></i> Otağa Gir
      </button>
      <button class="btn btn-secondary" onclick="location.reload()">Geri</button>
    </div>

    <div class="card" id="menu-join" style="display:none;">
      <div class="logo-text">Qoşul</div>
      <input type="number" id="room-input" placeholder="Otaq Kodu (6 rəqəm)">
      <button class="btn btn-primary" onclick="joinRoom()">
        <i class="fas fa-link"></i> Qoşul
      </button>
      <button class="btn btn-secondary" onclick="location.reload()">Geri</button>
    </div>
  </div>

  <div id="room-ui">
    <div class="video-wrapper" id="cinema-container">
      <video id="remote-video" playsinline autoplay></video>
      
      <div class="chat-overlay" id="chat-overlay">
        <div class="messages-container" id="chat-box">
          <div class="msg sys">Xoş gəldiniz! ❤️<br>Full ekranda da yaza bilərsiniz.</div>
        </div>
      </div>

      <div class="chat-bar">
        <input type="text" class="chat-input" id="msg-in" placeholder="Bir şeylər yaz..." onkeypress="handleEnter(event)">
        <button class="chat-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>

      <div class="controls-bar">
        <button class="c-btn" onclick="toggleScreenShare()" id="share-btn" title="Ekran Paylaş (Host)">
          <i class="fas fa-desktop"></i>
        </button>
        <button class="c-btn" onclick="toggleAudio()" id="audio-btn" title="Səsi Aç/Bağla">
          <i class="fas fa-volume-mute"></i>
        </button>
        <button class="c-btn" onclick="toggleChatVis()" title="Çatı Gizlət/Göstər">
          <i class="fas fa-comment-alt"></i>
        </button>
        <button class="c-btn" onclick="toggleFullScreen()" title="Tam Ekran">
          <i class="fas fa-expand"></i>
        </button>
        <button class="c-btn" style="color: #ff4444;" onclick="location.reload()" title="Çıxış">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- VARIABLES ---
    let myName = "Anonim";
    let myPeerId = null;
    let peer = null;
    let myStream = null;
    let connections = [];
    let isHost = false;

    // --- INTRO HANDLING ---
    window.onload = () => {
      setTimeout(() => {
        document.getElementById('intro-layer').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('intro-layer').style.display = 'none';
        }, 1000);
      }, 2500); // 2.5s intro

      // Check URL for room code
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('room')) {
        showJoin();
        document.getElementById('room-input').value = urlParams.get('room');
      }
    };

    // --- UI NAVIGATION ---
    function checkName() {
      const name = document.getElementById('username').value.trim();
      if (!name) { alert("Zəhmət olmasa adını yaz!"); return false; }
      myName = name;
      return true;
    }

    function createRoom() {
      if(!checkName()) return;
      myPeerId = Math.floor(100000 + Math.random() * 900000).toString();
      initPeer(myPeerId);
      isHost = true;
      
      document.getElementById('menu-main').style.display = 'none';
      document.getElementById('menu-create').style.display = 'block';
      document.getElementById('display-code').innerText = myPeerId;
    }

    function showJoin() {
      document.getElementById('menu-main').style.display = 'none';
      document.getElementById('menu-join').style.display = 'block';
    }

    function joinRoom() {
      if(!checkName()) return;
      const roomId = document.getElementById('room-input').value.trim();
      if(!roomId) return alert("Kodu daxil et!");
      
      initPeer(null, roomId); // Null ID for guest (auto-gen)
    }

    function enterRoom() {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('room-ui').style.display = 'flex';
      addSystemMsg(`Otaq yaradıldı. Salam, ${myName}!`);
    }

    function copyCode() {
      const link = `${window.location.origin}${window.location.pathname}?room=${myPeerId}`;
      navigator.clipboard.writeText(link);
      alert("Link kopyalandı! İndi sevgilinə at.");
    }

    // --- PEERJS LOGIC ---
    function initPeer(id, destId = null) {
      peer = new Peer(id);

      peer.on('open', (pid) => {
        console.log("My ID:", pid);
        if (destId) {
          const conn = peer.connect(destId, { metadata: { name: myName } });
          handleConnection(conn);
        }
      });

      peer.on('connection', (conn) => {
        handleConnection(conn);
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (stream) => {
          const v = document.getElementById('remote-video');
          v.srcObject = stream;
          addSystemMsg("Yayım başladı! Səs gəlmirsə səs düyməsini bas.");
        });
      });
    }

    function handleConnection(conn) {
      connections.push(conn);
      
      conn.on('open', () => {
        if (!isHost) {
          document.getElementById('lobby').style.display = 'none';
          document.getElementById('room-ui').style.display = 'flex';
          addSystemMsg(`Qoşuldun! Salam, ${myName}.`);
        }
        // Send initial greeting name
        conn.send({ type: 'sys', text: `${myName} otağa qoşuldu.` });
      });

      conn.on('data', (data) => {
        if (data.type === 'chat') addMsg(data.user, data.text);
        if (data.type === 'sys') addSystemMsg(data.text);
      });

      conn.on('close', () => connections = connections.filter(c => c !== conn));
    }

    // --- SCREEN SHARE (HOST) ---
    async function toggleScreenShare() {
      if (!isHost) return alert("Yalnız otağı yaradan (Host) ekran paylaşa bilər.");
      
      if (myStream) {
        myStream.getTracks().forEach(t => t.stop());
        myStream = null;
        document.getElementById('share-btn').classList.remove('active');
        return;
      }

      try {
        myStream = await navigator.mediaDevices.getDisplayMedia({ 
          video: { cursor: "always" }, 
          audio: true 
        });
        
        const video = document.getElementById('remote-video');
        video.srcObject = myStream;
        video.muted = true; // Local preview muted
        video.play();
        
        document.getElementById('share-btn').classList.add('active');

        connections.forEach(conn => peer.call(conn.peer, myStream));

        // Yayım dayananda
        myStream.getVideoTracks()[0].onended = () => {
          myStream = null;
          document.getElementById('share-btn').classList.remove('active');
        };
      } catch (err) {
        console.error(err);
      }
    }

    // --- CHAT & UI ---
    function sendMessage() {
      const input = document.getElementById('msg-in');
      const text = input.value.trim();
      if (!text) return;
      
      addMsg(myName, text); // Show locally
      connections.forEach(c => c.send({ type: 'chat', user: myName, text: text }));
      input.value = '';
    }

    function addMsg(user, text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<b>${user}:</b> ${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function addSystemMsg(text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'msg sys';
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }

    // --- CONTROLS ---
    function toggleAudio() {
      const v = document.getElementById('remote-video');
      v.muted = !v.muted;
      const btn = document.getElementById('audio-btn');
      btn.innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }

    function toggleChatVis() {
      document.getElementById('chat-overlay').classList.toggle('hidden');
    }

    function toggleFullScreen() {
      const elem = document.getElementById('cinema-container');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
          alert(`Error: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
