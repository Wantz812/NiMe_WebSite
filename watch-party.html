<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>🎬 CineParty - Sinxron İzləmə</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --bg: #0a0a0f;
      --surface: #1a1a24;
      --surface-light: #252534;
      --surface-hover: #2f2f3f;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #f59e0b;
      --success: #10b981;
      --error: #ef4444;
      --text: #ffffff;
      --text-muted: #9ca3af;
      --border: rgba(255,255,255,0.1);
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    /* Sadə və təmiz dizayn */
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .hidden { display: none !important; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      background: var(--primary);
      color: white;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
    }
    input, select {
      width: 100%;
      padding: 12px;
      background: var(--surface-light);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
    }
    /* Ana səhifə */
    #homeScreen { text-align: center; }
    .hero {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      padding: 60px 20px;
      border-radius: 24px;
      margin-bottom: 30px;
    }
    .hero h1 { font-size: 48px; margin-bottom: 10px; }
    .hero p { font-size: 18px; opacity: 0.9; }
    .button-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
    /* Otaq səhifəsi */
    #roomScreen { display: none; }
    #roomScreen.active { display: block; }
    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .video-container {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16/9;
      margin-bottom: 20px;
    }
    #videoPlayer {
      width: 100%;
      height: 100%;
    }
    .source-selector {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .source-btn {
      flex: 1;
      padding: 12px;
      background: var(--surface-light);
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .source-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }
    .viewers-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .viewer-tag {
      background: var(--surface-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
    }
    .chat-box {
      height: 400px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 16px;
      padding: 20px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 15px;
    }
    .message {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .message.own { flex-direction: row-reverse; }
    .message .avatar {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .message .bubble {
      max-width: 70%;
      background: var(--surface-light);
      padding: 10px 15px;
      border-radius: 12px;
    }
    .message.own .bubble { background: var(--primary); }
    .chat-input { display: flex; gap: 10px; }
    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--surface);
      padding: 30px;
      border-radius: 24px;
      max-width: 400px;
      width: 90%;
    }
  </style>
</head>
<body>

<!-- Ana səhifə -->
<div id="homeScreen" class="container">
  <div class="hero">
    <h1>🎬 CineParty</h1>
    <p>Birlikdə film izləməyin ən asan yolu</p>
  </div>
  <div class="button-group">
    <button class="btn" onclick="showCreateRoomModal()">➕ Otaq Yarat</button>
    <button class="btn" onclick="showJoinRoomModal()">🔗 Otağa Qoşul</button>
  </div>

  <!-- Ümumi film siyahısı (isteğe bağlı) -->
  <div class="card" style="margin-top: 30px;">
    <h2>📽️ Ümumi Film Siyahısı</h2>
    <div id="publicMovieList" style="margin: 20px 0;"></div>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="movieName" placeholder="Film adı">
      <input type="text" id="movieUrl" placeholder="YouTube linki">
      <button class="btn" onclick="addMovie()">Əlavə et</button>
    </div>
  </div>
</div>

<!-- Otaq səhifəsi -->
<div id="roomScreen">
  <div class="container">
    <div class="room-header">
      <h2 id="roomTitle">🎬 Otaq</h2>
      <div>
        <button class="btn" onclick="shareRoom()">📤 Paylaş</button>
        <button class="btn" onclick="leaveRoom()" style="background: var(--error);">🚪 Çıx</button>
      </div>
    </div>

    <div class="video-container">
      <div id="videoPlayer"></div>
    </div>

    <div class="source-selector">
      <div class="source-btn active" onclick="selectSource('youtube')" id="youtubeBtn">📺 YouTube</div>
      <div class="source-btn" onclick="selectSource('screen')" id="screenBtn">🖥️ Ekran Paylaş</div>
    </div>

    <div id="youtubeControls">
      <div style="display: flex; gap: 10px; margin: 20px 0;">
        <input type="text" id="videoUrl" placeholder="YouTube video linki">
        <button class="btn" onclick="loadVideo()">Yüklə</button>
      </div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn" onclick="syncPlay()">▶️ Oynat</button>
        <button class="btn" onclick="syncPause()">⏸️ Dayandır</button>
      </div>
    </div>

    <div id="screenControls" style="display: none; margin: 20px 0;">
      <button class="btn" onclick="startScreenShare()">🖥️ Ekran Paylaşımını Başlat</button>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="card">
        <h3>👥 İzləyicilər (<span id="viewerCount">1</span>)</h3>
        <div class="viewers-list" id="viewersList"></div>
      </div>

      <div class="chat-box">
        <h3>💬 Söhbət</h3>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
          <input type="text" id="messageInput" placeholder="Mesaj yazın...">
          <button class="btn" onclick="sendMessage()">Göndər</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- İstifadəçi adı modalı -->
<div id="usernameModal" class="modal">
  <div class="modal-content">
    <h2>👤 Adınızı daxil edin</h2>
    <input type="text" id="usernameInput" placeholder="Adınız" style="margin: 20px 0;">
    <button class="btn" onclick="setUsername()" style="width: 100%;">Başla</button>
  </div>
</div>

<!-- Otaq yaratma modalı -->
<div id="createRoomModal" class="modal" style="display: none;">
  <div class="modal-content">
    <h2>➕ Yeni Otaq Yarat</h2>
    <input type="text" id="roomName" placeholder="Otaq adı" style="margin: 20px 0;">
    <select id="roomType">
      <option value="public">🌍 Açıq</option>
      <option value="private">🔒 Şəxsi</option>
    </select>
    <label style="display: flex; align-items: center; gap: 10px; margin: 15px 0;">
      <input type="checkbox" id="hasPassword"> Şifrə qoy
    </label>
    <input type="password" id="roomPassword" placeholder="Şifrə" style="display: none; margin-bottom: 20px;">
    <button class="btn" onclick="createRoom()" style="width: 100%;">Yarat</button>
  </div>
</div>

<!-- Otağa qoşulma modalı -->
<div id="joinRoomModal" class="modal" style="display: none;">
  <div class="modal-content">
    <h2>🔗 Otağa Qoşul</h2>
    <input type="text" id="joinCode" placeholder="Otaq kodu" style="margin: 20px 0;">
    <input type="password" id="joinPassword" placeholder="Şifrə (varsa)" style="margin-bottom: 20px;">
    <button class="btn" onclick="joinRoom()" style="width: 100%;">Qoşul</button>
  </div>
</div>

<!-- Bildiriş -->
<div id="toast" style="position: fixed; top: 20px; right: 20px; background: var(--surface); padding: 15px 25px; border-radius: 12px; border: 2px solid var(--border); transform: translateX(400px); transition: 0.3s; z-index: 9999;"></div>

<script>
  // Firebase konfiqurasiyası
  const firebaseConfig = {
    apiKey: "AIzaSyBBgzimxxvNUWZTq3oFfW2pRIHwdT5eKic",
    authDomain: "nimewebsite.firebaseapp.com",
    databaseURL: "https://nimewebsite-default-rtdb.firebaseio.com",
    projectId: "nimewebsite",
    storageBucket: "nimewebsite.firebasestorage.app",
    messagingSenderId: "29668822721",
    appId: "1:29668822721:web:9b4b7b77a44ee600298e40",
    measurementId: "G-KCK8M7TLCK"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Global dəyişənlər
  let username = localStorage.getItem('username') || '';
  let currentRoom = null;
  let currentRoomId = null;
  let roomRef = null;
  let viewersRef = null;
  let messagesRef = null;
  let ytPlayer = null;
  let localStream = null;
  let peerConnections = {};
  let isSyncing = false;

  // İlk açılış
  window.onload = () => {
    if (!username) showUsernameModal();
    else {
      hideUsernameModal();
      document.getElementById('homeScreen').style.display = 'block';
    }
    // URL'de oda varsa
    const hash = window.location.hash.substring(1);
    if (hash) setTimeout(() => joinRoom(hash), 500);
  };

  // ========== İSTİFADƏÇİ ADI ==========
  function showUsernameModal() {
    document.getElementById('usernameModal').style.display = 'flex';
  }
  function hideUsernameModal() {
    document.getElementById('usernameModal').style.display = 'none';
  }
  function setUsername() {
    const name = document.getElementById('usernameInput').value.trim();
    if (name.length < 2) return alert('Ad ən az 2 hərf olmalıdır');
    username = name;
    localStorage.setItem('username', username);
    hideUsernameModal();
    document.getElementById('homeScreen').style.display = 'block';
  }

  // ========== MODAL FUNKSİYALARI ==========
  function showCreateRoomModal() {
    document.getElementById('createRoomModal').style.display = 'flex';
  }
  function hideCreateRoomModal() {
    document.getElementById('createRoomModal').style.display = 'none';
  }
  function showJoinRoomModal() {
    document.getElementById('joinRoomModal').style.display = 'flex';
  }
  function hideJoinRoomModal() {
    document.getElementById('joinRoomModal').style.display = 'none';
  }

  // Şifrə sahəsini göstər/gizlət
  document.getElementById('hasPassword').addEventListener('change', (e) => {
    document.getElementById('roomPassword').style.display = e.target.checked ? 'block' : 'none';
  });

  // ========== OTAQ YARATMA ==========
  function createRoom() {
    const name = document.getElementById('roomName').value.trim();
    const type = document.getElementById('roomType').value;
    const hasPassword = document.getElementById('hasPassword').checked;
    const password = hasPassword ? document.getElementById('roomPassword').value.trim() : '';
    if (!name) return alert('Otaq adı daxil edin');
    if (hasPassword && !password) return alert('Şifrə daxil edin');

    const newRoomRef = db.ref('rooms').push();
    const roomId = newRoomRef.key;
    const roomData = {
      name, type,
      host: username,
      password: password || '',
      viewers: { [username]: true },
      videoUrl: '',
      videoState: { playing: false, currentTime: 0, timestamp: Date.now() },
      createdAt: Date.now()
    };
    newRoomRef.set(roomData).then(() => {
      hideCreateRoomModal();
      joinRoom(roomId);
    });
  }

  // ========== OTAĞA QOŞUL ==========
  function joinRoom(roomId, password = '') {
    if (!roomId) {
      roomId = document.getElementById('joinCode').value.trim();
      password = document.getElementById('joinPassword').value.trim();
    }
    if (!roomId) return alert('Otaq kodu daxil edin');

    db.ref('rooms/' + roomId).get().then((snap) => {
      if (!snap.exists()) return alert('Otaq tapılmadı');
      const room = snap.val();
      if (room.password && room.password !== password) {
        alert('Şifrə yanlışdır');
        return;
      }

      // Otağa qoşul
      currentRoomId = roomId;
      currentRoom = room;
      roomRef = db.ref('rooms/' + roomId);
      viewersRef = db.ref('rooms/' + roomId + '/viewers');
      messagesRef = db.ref('rooms/' + roomId + '/messages');

      // İstifadəçini viewer-lərə əlavə et
      viewersRef.child(username).set(true);

      // UI keçid
      document.getElementById('homeScreen').style.display = 'none';
      document.getElementById('roomScreen').classList.add('active');
      document.getElementById('roomTitle').innerText = `🎬 ${room.name}`;
      window.location.hash = roomId;

      // Dinləyicilər
      viewersRef.on('value', (snap) => {
        const viewers = snap.val() ? Object.keys(snap.val()) : [];
        document.getElementById('viewerCount').innerText = viewers.length;
        document.getElementById('viewersList').innerHTML = viewers.map(v => `<div class="viewer-tag">${v}</div>`).join('');
      });

      // Mesajlar
      messagesRef.on('child_added', (snap) => {
        const msg = snap.val();
        addMessage(msg);
      });

      // Video state
      roomRef.child('videoState').on('value', (snap) => {
        const state = snap.val();
        if (!ytPlayer || isSyncing) return;
        isSyncing = true;
        if (state) {
          if (state.playing) ytPlayer.playVideo(); else ytPlayer.pauseVideo();
          ytPlayer.seekTo(state.currentTime, true);
        }
        setTimeout(() => isSyncing = false, 500);
      });

      // Video URL varsa yüklə
      if (room.videoUrl) {
        document.getElementById('videoUrl').value = room.videoUrl;
        loadVideo();
      }
    });
  }

  // ========== OTAQDAN ÇIX ==========
  function leaveRoom() {
    if (!currentRoomId) return;
    if (confirm('Çıxmaq istədiyinizə əminsiniz?')) {
      viewersRef.child(username).remove().then(() => {
        viewersRef.once('value', (snap) => {
          if (!snap.exists()) {
            db.ref('rooms/' + currentRoomId).remove();
          }
        });
      });
      roomRef.off();
      viewersRef.off();
      messagesRef.off();
      if (ytPlayer) ytPlayer.destroy();
      currentRoomId = null;
      document.getElementById('roomScreen').classList.remove('active');
      document.getElementById('homeScreen').style.display = 'block';
      window.location.hash = '';
    }
  }

  // ========== PAYLAŞ ==========
  function shareRoom() {
    const url = window.location.href.split('#')[0] + '#' + currentRoomId;
    navigator.clipboard.writeText(url).then(() => toast('Link kopyalandı!'));
  }

  // ========== YOUTUBE ==========
  function selectSource(source) {
    document.getElementById('youtubeBtn').classList.toggle('active', source === 'youtube');
    document.getElementById('screenBtn').classList.toggle('active', source === 'screen');
    document.getElementById('youtubeControls').style.display = source === 'youtube' ? 'block' : 'none';
    document.getElementById('screenControls').style.display = source === 'screen' ? 'block' : 'none';
  }

  function loadVideo() {
    const url = document.getElementById('videoUrl').value.trim();
    if (!url) return alert('Link daxil edin');
    let videoId = '';
    if (url.includes('youtube.com/watch?v=')) {
      videoId = url.split('v=')[1]?.split('&')[0];
    } else if (url.includes('youtu.be/')) {
      videoId = url.split('youtu.be/')[1]?.split('?')[0];
    } else if (url.includes('youtube.com/embed/')) {
      videoId = url.split('embed/')[1]?.split('?')[0];
    }
    if (!videoId) return alert('Düzgün YouTube linki deyil');

    document.getElementById('videoPlayer').innerHTML = `<div id="youtube-player"></div>`;
    if (ytPlayer) ytPlayer.destroy();
    ytPlayer = new YT.Player('youtube-player', {
      height: '100%',
      width: '100%',
      videoId: videoId,
      playerVars: { autoplay: 1, controls: 1 },
      events: {
        onStateChange: (e) => {
          if (!currentRoomId || isSyncing) return;
          const state = e.data;
          const playing = state === YT.PlayerState.PLAYING;
          const currentTime = ytPlayer.getCurrentTime();
          roomRef.child('videoState').set({
            playing, currentTime, timestamp: Date.now()
          });
        },
        onReady: () => {
          roomRef.child('videoState').once('value', (snap) => {
            const state = snap.val();
            if (state) {
              ytPlayer.seekTo(state.currentTime, true);
              if (state.playing) ytPlayer.playVideo(); else ytPlayer.pauseVideo();
            }
          });
        }
      }
    });
    roomRef.child('videoUrl').set(url);
  }

  function syncPlay() { if (ytPlayer) ytPlayer.playVideo(); }
  function syncPause() { if (ytPlayer) ytPlayer.pauseVideo(); }

  // ========== EKRAN PAYLAŞIMI (WebRTC) ==========
  async function startScreenShare() {
    if (!currentRoomId) return;
    try {
      localStream = await navigator.mediaDevices.getDisplayMedia({
        video: { cursor: 'always' },
        audio: true
      });

      const video = document.createElement('video');
      video.srcObject = localStream;
      video.autoplay = true;
      video.muted = true;
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.objectFit = 'contain';
      document.getElementById('videoPlayer').innerHTML = '';
      document.getElementById('videoPlayer').appendChild(video);

      toast('Ekran paylaşımı başladı');

      // WebRTC signaling
      const viewers = await viewersRef.once('value');
      const viewersList = viewers.val() ? Object.keys(viewers.val()) : [];
      for (const viewer of viewersList) {
        if (viewer !== username) createPeerConnection(viewer);
      }

      viewersRef.on('child_added', (snap) => {
        const viewer = snap.key;
        if (viewer !== username && !peerConnections[viewer]) createPeerConnection(viewer);
      });

      localStream.getVideoTracks()[0].onended = stopScreenShare;
    } catch (err) {
      toast('Xəta: ' + err.message);
    }
  }

  function createPeerConnection(targetUser) {
    const peer = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'turn:turn.viagenie.ca', username: 'webrtc', credential: 'webrtc' } // Ücretsiz TURN
      ]
    });
    peerConnections[targetUser] = peer;

    localStream.getTracks().forEach(track => peer.addTrack(track, localStream));

    peer.onicecandidate = (e) => {
      if (e.candidate) {
        db.ref(`rooms/${currentRoomId}/signaling/${targetUser}/${username}/ice`).push(e.candidate.toJSON());
      }
    };

    db.ref(`rooms/${currentRoomId}/signaling/${username}/${targetUser}/ice`).on('child_added', (snap) => {
      if (snap.exists()) {
        peer.addIceCandidate(new RTCIceCandidate(snap.val()));
      }
    });

    peer.createOffer().then(offer => {
      return peer.setLocalDescription(offer);
    }).then(() => {
      db.ref(`rooms/${currentRoomId}/signaling/${targetUser}/${username}/offer`).set(peer.localDescription.toJSON());
    });

    db.ref(`rooms/${currentRoomId}/signaling/${username}/${targetUser}/answer`).on('value', (snap) => {
      if (snap.exists() && !peer.currentRemoteDescription) {
        peer.setRemoteDescription(new RTCSessionDescription(snap.val()));
      }
    });

    peer.ontrack = (e) => {
      const video = document.createElement('video');
      video.srcObject = e.streams[0];
      video.autoplay = true;
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.objectFit = 'contain';
      document.getElementById('videoPlayer').innerHTML = '';
      document.getElementById('videoPlayer').appendChild(video);
    };
  }

  function stopScreenShare() {
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    for (let id in peerConnections) {
      peerConnections[id].close();
    }
    peerConnections = {};
    toast('Ekran paylaşımı dayandı');
  }

  // ========== CHAT ==========
  function sendMessage() {
    const text = document.getElementById('messageInput').value.trim();
    if (!text || !currentRoomId) return;
    messagesRef.push({ author: username, text, timestamp: Date.now() });
    document.getElementById('messageInput').value = '';
  }

  function addMessage(msg) {
    const div = document.createElement('div');
    div.className = 'message' + (msg.author === username ? ' own' : '');
    div.innerHTML = `
      <div class="avatar">${msg.author[0]}</div>
      <div class="bubble">
        <div style="font-size:12px; opacity:0.7;">${msg.author}</div>
        <div>${msg.text}</div>
      </div>
    `;
    document.getElementById('chatMessages').appendChild(div);
    document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
  }

  // ========== FİLM SİYAHISI ==========
  db.ref('publicMovies').on('value', (snap) => {
    const movies = snap.val();
    const list = document.getElementById('publicMovieList');
    if (!movies) { list.innerHTML = '<p>Hələ film yoxdur</p>'; return; }
    list.innerHTML = Object.keys(movies).map(key => `
      <div style="display:flex; justify-content:space-between; margin:10px 0;">
        <span>${movies[key].name}</span>
        <button onclick="voteMovie('${key}')">👍 ${movies[key].votes || 0}</button>
      </div>
    `).join('');
  });

  function addMovie() {
    const name = document.getElementById('movieName').value.trim();
    const url = document.getElementById('movieUrl').value.trim();
    if (!name) return alert('Film adı daxil edin');
    db.ref('publicMovies').push({ name, url, votes: 0, addedBy: username });
    document.getElementById('movieName').value = '';
    document.getElementById('movieUrl').value = '';
  }

  function voteMovie(id) {
    db.ref('publicMovies/' + id + '/votes').transaction(v => (v || 0) + 1);
  }

  // ========== BİLDİRİŞ ==========
  function toast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.transform = 'translateX(0)';
    setTimeout(() => t.style.transform = 'translateX(400px)', 3000);
  }
</script>
</body>
</html>
