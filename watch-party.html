<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>🎬 CinePartyy - Birlikdə İzlə</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    
    :root {
      --bg: #0a0a0f;
      --surface: #1a1a24;
      --surface-light: #252534;
      --surface-hover: #2f2f3f;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #f59e0b;
      --success: #10b981;
      --error: #ef4444;
      --text: #ffffff;
      --text-muted: #9ca3af;
      --border: rgba(255,255,255,0.1);
    }

    body { 
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 20px;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      opacity: 0.9;
    }

    /* Login Screen */
    .loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .loginBox {
      background: var(--surface);
      padding: 50px;
      border-radius: 24px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .loginLogo {
      font-size: 100px;
      margin-bottom: 20px;
    }

    .loginTitle {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .loginSubtitle {
      color: var(--text-muted);
      margin-bottom: 40px;
    }

    .inputGroup {
      margin-bottom: 20px;
    }

    .input {
      width: 100%;
      padding: 16px 20px;
      background: var(--surface-light);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--surface-hover);
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Poppins', sans-serif;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Main App */
    .mainApp {
      display: none;
    }

    .mainApp.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 968px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    .cardTitle {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Create Room */
    .roomForm {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .formGroup {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .select {
      padding: 12px 16px;
      background: var(--surface-light);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
    }

    /* Room List */
    .roomsList {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .roomItem {
      background: var(--surface-light);
      padding: 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: all 0.3s;
    }

    .roomItem:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .roomHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .roomName {
      font-size: 18px;
      font-weight: 700;
    }

    .roomBadge {
      padding: 4px 12px;
      background: var(--primary);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .roomBadge.private {
      background: var(--error);
    }

    .roomInfo {
      display: flex;
      gap: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Watch Room */
    .watchRoom {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      overflow-y: auto;
    }

    .watchRoom.active {
      display: block;
    }

    .watchHeader {
      background: var(--surface);
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .watchTitle {
      font-size: 24px;
      font-weight: 700;
    }

    .leaveBtn {
      padding: 12px 24px;
      background: var(--error);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .leaveBtn:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }

    .watchContent {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      padding: 20px;
      min-height: calc(100vh - 80px);
    }

    @media (max-width: 968px) {
      .watchContent {
        grid-template-columns: 1fr;
      }
    }

    .videoSection {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .videoWrapper {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .videoWrapper iframe {
      width: 100%;
      height: 100%;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .placeholderIcon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .placeholderText {
      font-size: 18px;
    }

    .urlInput {
      display: flex;
      gap: 12px;
    }

    .urlInput input {
      flex: 1;
    }

    .loadBtn {
      padding: 12px 24px;
      background: var(--success);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .loadBtn:hover {
      background: #059669;
    }

    /* Chat */
    .chatSection {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .viewersList {
      background: var(--surface);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
    }

    .viewersTitle {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewersGrid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .viewer {
      padding: 8px 16px;
      background: var(--surface-light);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .chatBox {
      background: var(--surface);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 500px;
    }

    .chatMessages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message.own {
      align-items: flex-end;
    }

    .messageAuthor {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .messageBubble {
      padding: 12px 16px;
      background: var(--surface-light);
      border-radius: 16px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message.own .messageBubble {
      background: var(--primary);
    }

    .messageTime {
      font-size: 11px;
      color: var(--text-muted);
    }

    .chatInput {
      display: flex;
      gap: 12px;
    }

    .chatInput input {
      flex: 1;
      padding: 12px 16px;
      background: var(--surface-light);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
    }

    .sendBtn {
      padding: 12px 24px;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .sendBtn:hover {
      background: var(--primary-dark);
    }

    /* Notification */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--surface);
      padding: 16px 24px;
      border-radius: 12px;
      border: 2px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(-150%);
      transition: transform 0.3s;
      z-index: 10000;
    }

    .notification.show {
      transform: translateY(0);
    }

    .notificationIcon {
      font-size: 24px;
    }

    .notificationText {
      font-weight: 600;
    }

    .emptyState {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .emptyIcon {
      font-size: 60px;
      margin-bottom: 16px;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--surface-light);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--surface-hover);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }
  </style>
</head>
<body>

<!-- Notification -->
<div class="notification" id="notification">
  <div class="notificationIcon" id="notificationIcon">✅</div>
  <div class="notificationText" id="notificationText"></div>
</div>

<!-- Login Screen -->
<div class="loginScreen" id="loginScreen">
  <div class="loginBox">
    <div class="loginLogo">🎬</div>
    <div class="loginTitle">CineParty</div>
    <div class="loginSubtitle">Birlikdə film izləyin!</div>
    <div class="inputGroup">
      <input 
        type="text" 
        class="input" 
        id="usernameInput" 
        placeholder="Adınızı daxil edin"
        maxlength="20"
      />
    </div>
    <button class="btn" onclick="login()">🚀 Başla</button>
  </div>
</div>

<!-- Main App -->
<div class="mainApp" id="mainApp">
  <div class="container">
    <div class="header">
      <div class="logo">🎬</div>
      <div class="title">CineParty</div>
      <div class="subtitle">Birlikdə film izləyin - Real-time sinxronizasiya</div>
    </div>

    <div class="grid">
      <!-- Create Room -->
      <div class="card">
        <div class="cardTitle">
          <span>➕</span>
          <span>Yeni Otaq Yarat</span>
        </div>
        <div class="roomForm">
          <div class="formGroup">
            <label class="label">Otaq Adı</label>
            <input 
              type="text" 
              class="input" 
              id="roomNameInput" 
              placeholder="Məs: Film Gecəsi"
              maxlength="30"
            />
          </div>
          <div class="formGroup">
            <label class="label">Növ</label>
            <select class="select" id="roomTypeSelect">
              <option value="public">🌍 Açıq (Hamı görə bilər)</option>
              <option value="private">🔒 Şəxsi (Yalnız link ilə)</option>
            </select>
          </div>
          <button class="btn" onclick="createRoom()">🎬 Otaq Yarat</button>
        </div>
      </div>

      <!-- Active Rooms -->
      <div class="card">
        <div class="cardTitle">
          <span>📺</span>
          <span>Aktiv Otaqlar (<span id="roomCount">0</span>)</span>
        </div>
        <div class="roomsList" id="roomsList">
          <div class="emptyState">
            <div class="emptyIcon">🎭</div>
            <div>Hələ otaq yoxdur</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Watch Room -->
<div class="watchRoom" id="watchRoom">
  <div class="watchHeader">
    <div class="watchTitle" id="watchRoomTitle">🎬 Film Otağı</div>
    <button class="leaveBtn" onclick="leaveRoom()">🚪 Çıx</button>
  </div>
  <div class="watchContent">
    <div class="videoSection">
      <div class="card">
        <div class="cardTitle">
          <span>📺</span>
          <span>Video Player</span>
        </div>
        <div class="videoWrapper" id="videoWrapper">
          <div class="placeholder">
            <div class="placeholderIcon">🎬</div>
            <div class="placeholderText">YouTube linki daxil edin</div>
          </div>
        </div>
        <div class="urlInput">
          <input 
            type="text" 
            class="input" 
            id="videoUrlInput" 
            placeholder="YouTube video linki (məs: https://youtube.com/watch?v=...)"
          />
          <button class="loadBtn" onclick="loadVideo()">▶️ Yüklə</button>
        </div>
      </div>
    </div>

    <div class="chatSection">
      <!-- Viewers -->
      <div class="viewersList">
        <div class="viewersTitle">
          <span>👥</span>
          <span>İzləyicilər (<span id="viewerCount">0</span>)</span>
        </div>
        <div class="viewersGrid" id="viewersList"></div>
      </div>

      <!-- Chat -->
      <div class="chatBox">
        <div class="chatMessages" id="chatMessages"></div>
        <div class="chatInput">
          <input 
            type="text" 
            class="input" 
            id="chatInput" 
            placeholder="Mesaj yazın..."
          />
          <button class="sendBtn" onclick="sendMessage()">📤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
  // ============= Firebase Configuration =============
  // DIQQƏT: Bu Firebase config-i dəyişdirin!
  // Firebase Console-dan yeni project yaradın və konfiqurasiyanızı buraya yapışdırın
  const firebaseConfig = {
    apiKey: "AIzaSyDEMO_KEY_REPLACE_ME",
    authDomain: "your-project.firebaseapp.com",
    databaseURL: "https://your-project-default-rtdb.firebaseio.com",
    projectId: "your-project-id",
    storageBucket: "your-project.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abc123"
  };

  // Firebase initialize
  let app, database;
  try {
    app = firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    console.log('✅ Firebase connected!');
  } catch (error) {
    console.error('❌ Firebase error:', error);
    showNotification('⚠️ Firebase bağlantı xətası! Config-i yoxlayın', '❌');
  }

  // ============= Global Variables =============
  let username = '';
  let currentRoomId = null;
  let currentRoomRef = null;
  let roomsRef = null;

  // ============= Login =============
  function login() {
    const input = document.getElementById('usernameInput');
    const name = input.value.trim();

    if (!name) {
      showNotification('⚠️ Adınızı daxil edin!', '❌');
      return;
    }

    if (name.length < 2) {
      showNotification('⚠️ Ad ən azı 2 simvol olmalıdır!', '❌');
      return;
    }

    username = name;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').classList.add('active');
    
    showNotification(`Xoş gəlmisiniz, ${username}! 🎉`, '👋');
    
    // Listen to rooms
    listenToRooms();
  }

  // ============= Rooms Management =============
  function listenToRooms() {
    roomsRef = database.ref('rooms');
    
    roomsRef.on('value', (snapshot) => {
      const rooms = snapshot.val() || {};
      renderRooms(rooms);
    });
  }

  function renderRooms(rooms) {
    const roomsList = document.getElementById('roomsList');
    const roomCount = document.getElementById('roomCount');
    
    const roomsArray = Object.entries(rooms).map(([id, data]) => ({
      id,
      ...data
    }));

    roomCount.textContent = roomsArray.length;

    if (roomsArray.length === 0) {
      roomsList.innerHTML = `
        <div class="emptyState">
          <div class="emptyIcon">🎭</div>
          <div>Hələ otaq yoxdur</div>
        </div>
      `;
      return;
    }

    roomsList.innerHTML = roomsArray.map(room => `
      <div class="roomItem" onclick="joinRoom('${room.id}')">
        <div class="roomHeader">
          <div class="roomName">${room.name}</div>
          <div class="roomBadge ${room.type}">${room.type === 'public' ? '🌍 Açıq' : '🔒 Şəxsi'}</div>
        </div>
        <div class="roomInfo">
          <span>👤 ${room.host}</span>
          <span>👥 ${Object.keys(room.viewers || {}).length} izləyici</span>
        </div>
      </div>
    `).join('');
  }

  function createRoom() {
    const nameInput = document.getElementById('roomNameInput');
    const typeSelect = document.getElementById('roomTypeSelect');
    
    const roomName = nameInput.value.trim();
    const roomType = typeSelect.value;

    if (!roomName) {
      showNotification('⚠️ Otaq adı daxil edin!', '❌');
      return;
    }

    const roomId = 'room_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    
    const roomData = {
      id: roomId,
      name: roomName,
      type: roomType,
      host: username,
      createdAt: Date.now(),
      videoUrl: '',
      viewers: {
        [username]: {
          name: username,
          joinedAt: Date.now()
        }
      }
    };

    database.ref('rooms/' + roomId).set(roomData)
      .then(() => {
        showNotification('✅ Otaq yaradıldı!', '🎉');
        nameInput.value = '';
        joinRoom(roomId);
      })
      .catch((error) => {
        console.error('Error creating room:', error);
        showNotification('❌ Otaq yaradıla bilmədi!', '⚠️');
      });
  }

  function joinRoom(roomId) {
    currentRoomId = roomId;
    currentRoomRef = database.ref('rooms/' + roomId);

    // Add viewer
    currentRoomRef.child('viewers/' + username).set({
      name: username,
      joinedAt: Date.now()
    });

    // Listen to room changes
    currentRoomRef.on('value', (snapshot) => {
      const room = snapshot.val();
      
      if (!room) {
        showNotification('❌ Otaq mövcud deyil!', '⚠️');
        leaveRoom();
        return;
      }

      updateWatchRoom(room);
    });

    // Show watch room
    document.getElementById('watchRoomTitle').textContent = '🎬 ' + roomId;
    document.getElementById('watchRoom').classList.add('active');
    document.getElementById('mainApp').classList.remove('active');

    showNotification('✅ Otağa qoşuldunuz!', '🎉');
  }

  function updateWatchRoom(room) {
    // Update title
    document.getElementById('watchRoomTitle').textContent = '🎬 ' + room.name;

    // Update viewers
    const viewers = room.viewers || {};
    const viewersList = document.getElementById('viewersList');
    const viewerCount = document.getElementById('viewerCount');
    
    const viewersArray = Object.values(viewers);
    viewerCount.textContent = viewersArray.length;

    viewersList.innerHTML = viewersArray.map(viewer => `
      <div class="viewer">${viewer.name}</div>
    `).join('');

    // Update video
    if (room.videoUrl && room.videoUrl !== document.getElementById('videoUrlInput').value) {
      document.getElementById('videoUrlInput').value = room.videoUrl;
      loadVideoFromUrl(room.videoUrl);
    }
  }

  function loadVideo() {
    const input = document.getElementById('videoUrlInput');
    const url = input.value.trim();

    if (!url) {
      showNotification('⚠️ YouTube linki daxil edin!', '❌');
      return;
    }

    if (!currentRoomId) return;

    // Update room video URL
    database.ref('rooms/' + currentRoomId + '/videoUrl').set(url)
      .then(() => {
        showNotification('✅ Video yükləndi!', '🎬');
      })
      .catch((error) => {
        console.error('Error loading video:', error);
        showNotification('❌ Video yüklənə bilmədi!', '⚠️');
      });
  }

  function loadVideoFromUrl(url) {
    const wrapper = document.getElementById('videoWrapper');
    
    let videoId = '';
    
    // Extract YouTube ID
    if (url.includes('youtube.com/watch?v=')) {
      videoId = url.split('v=')[1]?.split('&')[0];
    } else if (url.includes('youtu.be/')) {
      videoId = url.split('youtu.be/')[1]?.split('?')[0];
    }

    if (!videoId) {
      showNotification('⚠️ Düzgün YouTube linki deyil!', '❌');
      return;
    }

    wrapper.innerHTML = `
      <iframe 
        src="https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen
      ></iframe>
    `;
  }

  function leaveRoom() {
    if (!currentRoomId) return;

    // Remove viewer
    database.ref('rooms/' + currentRoomId + '/viewers/' + username).remove();

    // Check if room is empty
    database.ref('rooms/' + currentRoomId + '/viewers').once('value', (snapshot) => {
      const viewers = snapshot.val();
      if (!viewers || Object.keys(viewers).length === 0) {
        // Delete empty room
        database.ref('rooms/' + currentRoomId).remove();
        showNotification('🗑️ Otaq silindi (boş idi)', '🚮');
      }
    });

    // Stop listening
    if (currentRoomRef) {
      currentRoomRef.off();
    }

    currentRoomId = null;
    currentRoomRef = null;

    // Show main app
    document.getElementById('watchRoom').classList.remove('active');
    document.getElementById('mainApp').classList.add('active');

    // Clear video
    document.getElementById('videoWrapper').innerHTML = `
      <div class="placeholder">
        <div class="placeholderIcon">🎬</div>
        <div class="placeholderText">YouTube linki daxil edin</div>
      </div>
    `;
    document.getElementById('videoUrlInput').value = '';

    showNotification('👋 Otaqdan çıxdınız', '🚪');
  }

  // ============= Chat =============
  function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();

    if (!text || !currentRoomId) return;

    const messageData = {
      author: username,
      text: text,
      timestamp: Date.now()
    };

    database.ref('rooms/' + currentRoomId + '/messages').push(messageData)
      .then(() => {
        input.value = '';
      })
      .catch((error) => {
        console.error('Error sending message:', error);
      });
  }

  // Listen to messages
  function listenToMessages(roomId) {
    database.ref('rooms/' + roomId + '/messages').on('child_added', (snapshot) => {
      const message = snapshot.val();
      addMessageToChat(message);
    });
  }

  function addMessageToChat(message) {
    const messagesDiv = document.getElementById('chatMessages');
    const isOwn = message.author === username;
    
    const messageEl = document.createElement('div');
    messageEl.className = 'message' + (isOwn ? ' own' : '');
    
    const time = new Date(message.timestamp).toLocaleTimeString('az', { 
      hour: '2-digit', 
      minute: '2-digit' 
    });

    messageEl.innerHTML = `
      <div class="messageAuthor">${message.author}</div>
      <div class="messageBubble">${message.text}</div>
      <div class="messageTime">${time}</div>
    `;

    messagesDiv.appendChild(messageEl);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // ============= Notification =============
  function showNotification(text, icon = '✅') {
    const notification = document.getElementById('notification');
    document.getElementById('notificationText').textContent = text;
    document.getElementById('notificationIcon').textContent = icon;

    notification.classList.add('show');
    setTimeout(() => {
      notification.classList.remove('show');
    }, 3000);
  }

  // ============= Event Listeners =============
  document.addEventListener('DOMContentLoaded', () => {
    // Username input
    document.getElementById('usernameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        login();
      }
    });

    // Room name input
    document.getElementById('roomNameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        createRoom();
      }
    });

    // Chat input
    document.getElementById('chatInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    // Video URL input
    document.getElementById('videoUrlInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        loadVideo();
      }
    });
  });

  // Listen to messages when joining room
  const originalJoinRoom = joinRoom;
  joinRoom = function(roomId) {
    originalJoinRoom(roomId);
    listenToMessages(roomId);
  };
</script>

</body>
</html>
