<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CineParty | Birlikdə İzlə</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root { --bg: #0b0e14; --primary: #e50914; --card: #161b22; --text: #ffffff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    /* LOBBY */
    #lobby { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(circle, #1a202c 0%, #000 100%); display: flex; align-items: center; justify-content: center; }
    .card { width: 90%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .logo { font-size: 35px; font-weight: 800; color: var(--primary); margin-bottom: 25px; letter-spacing: 2px; }
    
    input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #30363d; background: #0d1117; color: white; margin-bottom: 15px; text-align: center; font-size: 16px; }
    input:focus { border-color: var(--primary); outline: none; }
    
    .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-red { background: var(--primary); color: white; }
    .btn-red:hover { background: #b20710; }
    .btn-outline { background: transparent; color: white; border: 1px solid #30363d; }
    .btn-outline:hover { background: #30363d; }

    /* ROOM UI */
    #room-ui { display: none; height: 100vh; width: 100vw; background: #000; }
    .video-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* CONTROLS */
    .controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(0,0,0,0.8); padding: 10px 25px; border-radius: 50px; backdrop-filter: blur(10px); z-index: 100; opacity: 0; transition: 0.5s; }
    .video-container:hover .controls { opacity: 1; }
    .c-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 10px; transition: 0.2s; }
    .c-btn:hover { color: var(--primary); transform: scale(1.1); }
    
    /* SYSTEM MESSAGES */
    #status-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; font-size: 13px; color: #aaa; z-index: 200; pointer-events: none; }

    #play-shield { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div id="lobby">
  <div class="card" id="menu-start">
    <div class="logo">CINEPARTY</div>
    <input type="text" id="username" placeholder="Adınız">
    <button class="btn btn-red" onclick="startAsHost()"><i class="fas fa-plus"></i> Otaq Yarat</button>
    <button class="btn btn-outline" onclick="showJoinMenu()"><i class="fas fa-link"></i> Otağa Qoşul</button>
  </div>

  <div class="card" id="menu-host" style="display:none;">
    <div class="logo" style="font-size: 24px;">Otaq Kodu</div>
    <div id="room-code-box" style="font-size: 32px; font-weight: bold; color: #46d369; margin: 20px 0; border: 2px dashed #444; padding: 10px; border-radius: 10px; cursor: pointer;" onclick="copyCode()">...</div>
    <p style="font-size: 13px; color: #888; margin-bottom: 20px;">Bu kodu sevgilinə göndər</p>
    <button class="btn btn-red" onclick="enterRoom()">Otağa Daxil Ol</button>
  </div>

  <div class="card" id="menu-join" style="display:none;">
    <div class="logo" style="font-size: 24px;">Qoşul</div>
    <input type="text" id="join-id" placeholder="6 rəqəmli kodu yaz">
    <button class="btn btn-red" id="join-confirm-btn" onclick="startAsGuest()">İndi Qoşul</button>
    <button class="btn btn-outline" onclick="location.reload()">Geri</button>
  </div>
</div>

<div id="room-ui">
  <div id="status-overlay">Sistem: Bağlantı gözlənilir...</div>
  <div class="video-container" id="v-cont">
    <video id="main-video" playsinline autoplay></video>
    
    <div id="play-shield">
      <button class="btn btn-red" style="width: auto; padding: 15px 40px; border-radius: 50px;" onclick="forcePlay()">🎥 VİDEONU BAŞLAT</button>
    </div>

    <div class="controls">
      <button class="c-btn" id="share-btn" onclick="toggleShare()" title="Ekranı Paylaş"><i class="fas fa-desktop"></i></button>
      <button class="c-btn" id="mute-btn" onclick="toggleMute()"><i class="fas fa-volume-up"></i></button>
      <button class="c-btn" onclick="toggleFullscreen()"><i class="fas fa-expand"></i></button>
      <button class="c-btn" style="color: #ff4d4d;" onclick="location.reload()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </div>
</div>

<script>
  let peer = null;
  let conn = null;
  let isHost = false;
  let myStream = null;

  const peerOptions = {
    config: { 'iceServers': [
      { 'urls': 'stun:stun.l.google.com:19302' },
      { 'urls': 'stun:stun1.l.google.com:19302' }
    ]},
    debug: 1
  };

  function updateStatus(text) {
    document.getElementById('status-overlay').innerText = `Sistem: ${text}`;
  }

  // --- HOST FUNKSİYALARI ---
  function startAsHost() {
    const name = document.getElementById('username').value || "Host";
    const hostId = Math.floor(100000 + Math.random() * 900000).toString();
    
    peer = new Peer(hostId, peerOptions);
    
    peer.on('open', id => {
      document.getElementById('menu-start').style.display = 'none';
      document.getElementById('menu-host').style.display = 'block';
      document.getElementById('room-code-box').innerText = id;
      isHost = true;
      updateStatus("Otaq yaradıldı. Gözlənilir...");
    });

    peer.on('connection', connection => {
      conn = connection;
      updateStatus("Sevgilin otağa girdi!");
      if(myStream) peer.call(conn.peer, myStream);
    });

    peer.on('error', err => alert("Xəta: " + err.type));
  }

  // --- QONAQ FUNKSİYALARI ---
  function showJoinMenu() {
    document.getElementById('menu-start').style.display = 'none';
    document.getElementById('menu-join').style.display = 'block';
  }

  function startAsGuest() {
    const targetId = document.getElementById('join-id').value.trim();
    if(!targetId) return alert("Kod daxil et!");
    
    document.getElementById('join-confirm-btn').innerText = "Bağlanır...";
    peer = new Peer(peerOptions);

    peer.on('open', () => {
      conn = peer.connect(targetId);
      conn.on('open', () => {
        enterRoom();
        updateStatus("Otağa qoşuldun. Yayım gözlənilir...");
      });
    });

    peer.on('call', call => {
      call.answer();
      call.on('stream', stream => {
        const v = document.getElementById('main-video');
        v.srcObject = stream;
        document.getElementById('play-shield').style.display = 'flex';
      });
    });

    peer.on('error', () => {
      alert("Qoşulmaq mümkün olmadı. Kodu yoxlayın.");
      location.reload();
    });
  }

  // --- ÜMUMİ ---
  async function toggleShare() {
    if(!isHost) return alert("Yalnız otaq sahibi paylaşa bilər.");
    try {
      myStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      document.getElementById('main-video').srcObject = myStream;
      document.getElementById('share-btn').style.color = "#46d369";
      
      if(conn) peer.call(conn.peer, myStream);
    } catch(e) { console.error(e); }
  }

  function enterRoom() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('room-ui').style.display = 'block';
  }

  function forcePlay() {
    const v = document.getElementById('main-video');
    v.play();
    v.muted = false;
    document.getElementById('play-shield').style.display = 'none';
    updateStatus("Yayım başladı!");
  }

  function copyCode() {
    const code = document.getElementById('room-code-box').innerText;
    navigator.clipboard.writeText(code);
    alert("Kod kopyalandı!");
  }

  function toggleMute() {
    const v = document.getElementById('main-video');
    v.muted = !v.muted;
    document.getElementById('mute-btn').innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
  }

  function toggleFullscreen() {
    const el = document.getElementById('v-cont');
    if (!document.fullscreenElement) el.requestFullscreen();
    else document.exitFullscreen();
  }
</script>
</body>
</html>
