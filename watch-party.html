<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🎥 Film Gecesi · SORUNSUZ EKRAN PAYLAŞIMI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- PEERJS 1.5.5 KARARLI -->
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: #0a0c10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container { max-width: 1300px; width: 100%; }

        /* ANA GİRİŞ */
        .home-card {
            background: rgba(18,22,30,0.9);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 28px;
            max-width: 500px;
            margin: 0 auto;
            color: white;
            border: 1px solid #ff8a5c40;
        }
        .home-header { text-align: center; }
        .home-header i { font-size: 56px; color: #ff8a5c; background: #ff8a5c20; padding: 22px; border-radius: 30px; }
        h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(to right, #fff, #ffd0b5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-group { display: flex; flex-direction: column; gap: 16px; margin-top: 36px; }
        .btn {
            border: none; padding: 18px 28px; border-radius: 60px; font-size: 1.2rem;
            font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px;
            background: rgba(255,255,255,0.05); color: white; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: #ff8a5c; color: black; }
        .btn-outline { background: transparent; border: 2px solid #ff8a5c; color: #ff8a5c; }
        .btn:hover { transform: scale(0.97); background: #ff9e77; }

        /* ODA GÖRÜNÜMÜ */
        .room-card {
            background: rgba(10,12,18,0.9);
            backdrop-filter: blur(25px);
            border-radius: 40px;
            padding: 28px 24px;
            border: 1px solid #ff8a5c40;
            color: white;
        }
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .room-code-badge {
            background: #1e1e2a; padding: 12px 24px; border-radius: 50px;
            border: 1px solid #ff8a5c; color: #ff8a5c; display: flex; align-items: center; gap: 12px;
            font-weight: 600;
        }
        .status {
            display: flex; align-items: center; gap: 10px; background: #1a1e26;
            padding: 10px 22px; border-radius: 40px; color: #cbd5e6;
        }

        /* ANA VİDEO ALANI (YOUTUBE + EKRAN PAYLAŞIMI ORTAK) */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: black;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 20px 35px black;
        }
        #player, #screenVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
        #screenVideo { display: none; } /* Varsayılan YouTube görünür */
        .video-source-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid #ff8a5c;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }
        .video-source-badge i { color: #ff8a5c; }

        /* KONTROL PANELİ */
        .controls-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .video-id-area {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .video-id-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 60px;
            padding: 14px 22px;
            color: white;
        }
        .btn-small {
            background: #ff8a5c;
            border: none;
            border-radius: 60px;
            padding: 14px 26px;
            color: black;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .control-buttons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
        }
        .control-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 14px 20px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .control-btn:hover:not(.disabled) { background: #ff8a5c; color: black; }
        .seek-slider { flex: 2; min-width: 180px; accent-color: #ff8a5c; }

        /* SOHBET - FLOATING */
        .chat-toggle-btn {
            position: fixed; bottom: 30px; right: 30px;
            width: 65px; height: 65px; border-radius: 50%;
            background: #ff8a5c; color: black; border: none;
            font-size: 28px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; box-shadow: 0 10px 25px #ff8a5c80;
        }
        .overlay-chat {
            position: fixed; bottom: 110px; right: 30px;
            width: 320px; height: 450px;
            background: rgba(10,12,18,0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid #ff8a5c;
            display: flex; flex-direction: column;
            padding: 20px; z-index: 999;
        }
        .overlay-chat.hidden { display: none; }
        .chat-messages {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
        }
        .message {
            background: rgba(255,255,255,0.08); padding: 12px 16px; border-radius: 22px;
            max-width: 85%; word-break: break-word; align-self: flex-start; color: white;
        }
        .message.own { background: #ff8a5c; color: black; align-self: flex-end; }
        .message small { display: block; font-size: 0.7rem; opacity: 0.8; margin-top: 5px; }
        .chat-input-area { display: flex; gap: 12px; margin-top: 16px; }
        .chat-input {
            flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px; padding: 14px 20px; color: white; outline: none;
        }
        .chat-send { background: #ff8a5c; border: none; border-radius: 50px; padding: 14px 20px; color: black; cursor: pointer; }

        .hidden { display: none; }
        .disabled { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body>
    <!-- GİRİŞ EKRANI -->
    <div id="homeView" class="home-card">
        <div class="home-header">
            <i class="fas fa-film"></i>
            <h1>Uzaktan Film</h1>
            <div style="color:#b9c2da; margin-top:12px;">Ekran paylaşımlı · TURN · Sorunsuz</div>
        </div>
        <div class="btn-group">
            <button id="createRoomBtn" class="btn btn-primary"><i class="fas fa-video"></i> Oda Oluştur</button>
            <button id="joinRoomBtn" class="btn btn-outline"><i class="fas fa-door-open"></i> Odaya Katıl</button>
        </div>
    </div>

    <!-- ODA EKRANI -->
    <div id="roomView" class="room-card hidden">
        <div class="room-header">
            <div class="room-code-badge"><i class="fas fa-hashtag"></i> <span id="roomCodeDisplay">...</span></div>
            <div id="connectionStatus" class="status"><i class="fas fa-circle"></i> Bağlantı bekleniyor...</div>
        </div>

        <!-- ANA VİDEO ALANI (HEM YOUTUBE HEM EKRAN PAYLAŞIMI) -->
        <div class="video-container">
            <div id="player"></div>
            <video id="screenVideo" autoplay playsinline muted></video>
            <div class="video-source-badge" id="videoSourceBadge">
                <i class="fab fa-youtube"></i> YouTube
            </div>
        </div>

        <!-- KONTROL PANELİ -->
        <div class="controls-panel">
            <div class="video-id-area">
                <input type="text" id="videoIdInput" class="video-id-input" placeholder="YouTube video ID" value="dQw4w9WgXcQ">
                <button id="loadVideoBtn" class="btn-small"><i class="fas fa-cloud-upload-alt"></i> Yükle</button>
            </div>
            <div class="control-buttons">
                <button id="seekBackBtn" class="control-btn"><i class="fas fa-backward"></i> 10</button>
                <button id="playPauseBtn" class="control-btn"><i class="fas fa-play"></i></button>
                <button id="seekForwardBtn" class="control-btn"><i class="fas fa-forward"></i> 10</button>
                <input type="range" id="seekSlider" class="seek-slider" min="0" value="0" step="1">
                <span id="timeDisplay" style="color:#ccd6f0;">00:00 / 00:00</span>
            </div>
            <div style="display:flex; gap:12px; margin-top:16px;">
                <button id="screenShareBtn" class="btn-small" style="flex:1; background:#3b3f4a; color:white;">
                    <i class="fas fa-share-alt"></i> Ekran Paylaş
                </button>
                <button id="stopScreenShareBtn" class="btn-small" style="flex:0.5; background:#ff4d4d; color:white; display:none;">
                    <i class="fas fa-stop"></i> Durdur
                </button>
            </div>
            <div id="roomMessage" style="margin-top:16px; color:#99a5c2; text-align:center;">
                <i class="fas fa-info-circle"></i> Host değilsen kontroller pasiftir.
            </div>
        </div>
    </div>

    <!-- FLOATING SOHBET -->
    <button id="chatToggleBtn" class="chat-toggle-btn"><i class="fas fa-comment"></i></button>
    <div id="overlayChat" class="overlay-chat hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 style="color:white;"><i class="fas fa-comment-dots" style="color:#ff8a5c;"></i> Sohbet</h3>
            <button id="closeChatBtn" style="background:none; border:none; color:#aaa; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div style="color:#99a5c2; text-align:center;">💬 Bağlantı kurulunca mesajlar gelecek...</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="Mesaj yaz...">
            <button id="sendChatBtn" class="chat-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        (function(){
            "use strict";

            // ---------- URL PARAMETRELERİ ----------
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            const hostParam = urlParams.get('host');
            const isHost = hostParam === 'true';
            const roomCode = roomParam || '';

            // ---------- DOM ----------
            const homeView = document.getElementById('homeView');
            const roomView = document.getElementById('roomView');
            const roomCodeDisplay = document.getElementById('roomCodeDisplay');
            const connectionStatusEl = document.getElementById('connectionStatus');
            const roomMessage = document.getElementById('roomMessage');
            const videoIdInput = document.getElementById('videoIdInput');
            const loadVideoBtn = document.getElementById('loadVideoBtn');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const seekBackBtn = document.getElementById('seekBackBtn');
            const seekForwardBtn = document.getElementById('seekForwardBtn');
            const seekSlider = document.getElementById('seekSlider');
            const timeDisplay = document.getElementById('timeDisplay');
            const screenShareBtn = document.getElementById('screenShareBtn');
            const stopScreenShareBtn = document.getElementById('stopScreenShareBtn');
            const screenVideo = document.getElementById('screenVideo');
            const playerDiv = document.getElementById('player');
            const videoSourceBadge = document.getElementById('videoSourceBadge');
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');
            const sendChatBtn = document.getElementById('sendChatBtn');

            // ---------- GLOBALS ----------
            let peer = null;
            let conn = null;
            let mediaCall = null;
            let player = null;
            let isPlayerReady = false;
            let isRemoteAction = false;
            let currentVideoId = 'dQw4w9WgXcQ';
            let seekUpdateInterval = null;
            let localScreenStream = null;
            let isScreenSharing = false;

            // ---------- DOĞRU TURN/STUN KONFİGÜRASYONU (PeerJS options formatında) ----------
            const peerOptions = {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        // OpenRelay TURN (ücretsiz, her ağda çalışır)
                        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
                    ]
                },
                debug: 2  // Konsolda bağlantı detaylarını görmek için
            };

            // ---------- YARDIMCILAR ----------
            function extractVideoId(urlOrId) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = urlOrId.match(regExp);
                return (match && match[2].length === 11) ? match[2] : urlOrId;
            }

            function formatTime(seconds) {
                if (isNaN(seconds)) return '00:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }

            function setConnectionStatus(text, isConnected = false) {
                if (connectionStatusEl) {
                    connectionStatusEl.innerHTML = isConnected 
                        ? `<i class="fas fa-circle" style="color:#48ca7c;"></i> ${text}`
                        : `<i class="fas fa-circle" style="color:#ffb347;"></i> ${text}`;
                }
            }

            // ---------- YETKİ KONTROLÜ ----------
            function updateUIByRole() {
                if (!isHost) {
                    // İzleyici: tüm kontroller devre dışı
                    videoIdInput.disabled = true;
                    loadVideoBtn.disabled = true;
                    playPauseBtn.disabled = true;
                    seekBackBtn.disabled = true;
                    seekForwardBtn.disabled = true;
                    seekSlider.disabled = true;
                    screenShareBtn.disabled = true;
                    screenShareBtn.style.display = 'none';
                    stopScreenShareBtn.style.display = 'none';
                    playPauseBtn.classList.add('disabled');
                    roomMessage.innerHTML = '<i class="fas fa-eye"></i> İzleyici modu · Kontroller pasif, host ile senkronize izliyorsun.';
                } else {
                    // Host: kontroller aktif
                    videoIdInput.disabled = false;
                    loadVideoBtn.disabled = false;
                    playPauseBtn.disabled = false;
                    seekBackBtn.disabled = false;
                    seekForwardBtn.disabled = false;
                    seekSlider.disabled = false;
                    screenShareBtn.disabled = false;
                    screenShareBtn.style.display = 'flex';
                    playPauseBtn.classList.remove('disabled');
                    roomMessage.innerHTML = '<i class="fas fa-crown"></i> Host sensin · Videoyu sen kontrol ediyorsun.';
                }
            }

            // ---------- VERİ GÖNDER ----------
            function sendMessage(obj) {
                if (conn && conn.open) {
                    conn.send(obj);
                }
            }

            // ---------- YOUTUBE PLAYER ----------
            function initPlayer(videoId) {
                if (!window.YT) { setTimeout(() => initPlayer(videoId), 200); return; }
                if (player && player.destroy) player.destroy();
                player = new YT.Player('player', {
                    videoId: videoId,
                    playerVars: {
                        autoplay: 0, controls: 0, disablekb: 1, fs: 0,
                        modestbranding: 1, rel: 0, showinfo: 0, iv_load_policy: 3
                    },
                    events: {
                        onReady: onPlayerReady,
                        onStateChange: onPlayerStateChange
                    }
                });
                currentVideoId = videoId;
            }

            function onPlayerReady() {
                isPlayerReady = true;
                seekSlider.max = player.getDuration() || 100;
                if (isHost && conn) sendFullState();
                if (seekUpdateInterval) clearInterval(seekUpdateInterval);
                seekUpdateInterval = setInterval(() => {
                    if (player && player.getCurrentTime) {
                        const current = player.getCurrentTime();
                        const duration = player.getDuration();
                        seekSlider.value = current;
                        timeDisplay.innerText = `${formatTime(current)} / ${formatTime(duration)}`;
                        playPauseBtn.innerHTML = (player.getPlayerState() === YT.PlayerState.PLAYING) 
                            ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
                    }
                }, 500);
            }

            function onPlayerStateChange(e) {
                if (!isRemoteAction && isHost && conn) {
                    if (e.data === YT.PlayerState.PLAYING) sendMessage({ type: 'play', time: player.getCurrentTime() });
                    else if (e.data === YT.PlayerState.PAUSED) sendMessage({ type: 'pause', time: player.getCurrentTime() });
                }
                isRemoteAction = false;
            }

            function sendFullState() {
                if (!player || !isPlayerReady || !conn) return;
                sendMessage({
                    type: 'sync',
                    videoId: currentVideoId,
                    time: player.getCurrentTime(),
                    playing: player.getPlayerState() === YT.PlayerState.PLAYING
                });
            }

            // ---------- VİDEO KAYNAĞINI DEĞİŞTİR (YouTube / Ekran) ----------
            function showYouTubeSource() {
                playerDiv.style.display = 'block';
                screenVideo.style.display = 'none';
                videoSourceBadge.innerHTML = '<i class="fab fa-youtube"></i> YouTube';
                if (player && player.pauseVideo) player.pauseVideo(); // Host kontrol eder
            }

            function showScreenSource() {
                playerDiv.style.display = 'none';
                screenVideo.style.display = 'block';
                videoSourceBadge.innerHTML = '<i class="fas fa-desktop"></i> Ekran Paylaşımı';
            }

            // ---------- EKRAN PAYLAŞIMI ----------
            async function startScreenShare() {
                if (!isHost) return;
                try {
                    localScreenStream = await navigator.mediaDevices.getDisplayMedia({ 
                        video: true, 
                        audio: false,
                        surfaceSwitching: 'include' // Chrome'da sekme değiştirme
                    });
                    
                    screenVideo.srcObject = localScreenStream;
                    showScreenSource();
                    
                    // UI güncelle
                    screenShareBtn.style.display = 'none';
                    stopScreenShareBtn.style.display = 'flex';
                    isScreenSharing = true;
                    
                    // İzleyiciye çağrı yap
                    if (conn && conn.peer) {
                        mediaCall = peer.call(conn.peer, localScreenStream);
                        mediaCall.on('close', () => stopScreenShare());
                    }
                    
                    // Paylaşım durduğunda
                    localScreenStream.getVideoTracks()[0].onended = () => stopScreenShare();
                    
                    // İzleyiciye bildirim
                    sendMessage({ type: 'screen-start' });
                    
                } catch (err) {
                    console.error('Ekran paylaşım hatası:', err);
                    alert('Ekran paylaşımı başlatılamadı: ' + err.message);
                }
            }

            function stopScreenShare() {
                if (localScreenStream) {
                    localScreenStream.getTracks().forEach(t => t.stop());
                    localScreenStream = null;
                }
                if (mediaCall) {
                    mediaCall.close();
                    mediaCall = null;
                }
                screenVideo.srcObject = null;
                showYouTubeSource();
                
                // UI güncelle
                screenShareBtn.style.display = 'flex';
                stopScreenShareBtn.style.display = 'none';
                isScreenSharing = false;
                
                sendMessage({ type: 'screen-stop' });
            }

            // ---------- SOHBET ----------
            function addChatMessage(text, isOwn = false, sender = 'Arkadaş') {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message');
                if (isOwn) msgDiv.classList.add('own');
                const time = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                msgDiv.innerHTML = `${text}<br><small>${isOwn ? 'Sen' : sender} • ${time}</small>`;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function sendChatMessage() {
                const msg = chatInput.value.trim();
                if (!msg) return;
                addChatMessage(msg, true, 'Sen');
                sendMessage({ type: 'chat', message: msg });
                chatInput.value = '';
            }

            // ---------- PEERJS BAŞLAT - DÜZGÜN KONFİGÜRASYON ----------
            function initPeerForRoom() {
                if (!roomCode) return;

                if (isHost) {
                    // HOST: Belirli ID ile, options ile TURN eklenmiş
                    peer = new Peer(roomCode, peerOptions);
                    
                    peer.on('open', (id) => {
                        setConnectionStatus('Host hazır, oda aktif', true);
                    });
                    
                    peer.on('connection', (incomingConn) => {
                        conn = incomingConn;
                        conn.on('open', () => {
                            setConnectionStatus('İzleyici bağlandı!', true);
                            if (player && isPlayerReady) sendFullState();
                            addChatMessage('İzleyici odaya katıldı.', false, 'Sistem');
                        });
                        conn.on('data', (data) => {
                            if (data.type === 'requestState') sendFullState();
                            else if (data.type === 'chat') addChatMessage(data.message, false, 'İzleyici');
                        });
                    });
                    
                    peer.on('call', (call) => {
                        // İzleyici aramaz, ama cevap ver
                        call.answer();
                    });
                    
                    peer.on('error', (err) => {
                        console.error('Peer hatası:', err);
                        if (err.type === 'unavailable-id') {
                            alert('Bu oda kodu zaten kullanımda! Farklı bir kod oluşturun.');
                            window.location.search = '';
                        }
                    });
                    
                } else {
                    // İZLEYİCİ: Rastgele ID
                    peer = new Peer(peerOptions);
                    
                    peer.on('open', () => {
                        setConnectionStatus('Bağlanıyor...', false);
                        conn = peer.connect(roomCode);
                        
                        conn.on('open', () => {
                            setConnectionStatus('Host ile bağlantı kuruldu!', true);
                            conn.send({ type: 'requestState' });
                            addChatMessage('Host ile bağlantı kuruldu!', false, 'Sistem');
                        });
                        
                        conn.on('data', (data) => {
                            if (data.type === 'sync') {
                                if (data.videoId && data.videoId !== currentVideoId) {
                                    currentVideoId = data.videoId;
                                    videoIdInput.value = currentVideoId;
                                    if (player) {
                                        isRemoteAction = true;
                                        player.loadVideoById(currentVideoId, data.time || 0);
                                    } else initPlayer(currentVideoId);
                                }
                                if (data.time !== undefined && player) {
                                    isRemoteAction = true;
                                    player.seekTo(data.time, true);
                                }
                                if (data.playing === true && player) {
                                    isRemoteAction = true;
                                    player.playVideo();
                                } else if (data.playing === false && player) {
                                    isRemoteAction = true;
                                    player.pauseVideo();
                                }
                            } else if (data.type === 'play') {
                                isRemoteAction = true; player.playVideo(); if(data.time) player.seekTo(data.time, true);
                            } else if (data.type === 'pause') {
                                isRemoteAction = true; player.pauseVideo(); if(data.time) player.seekTo(data.time, true);
                            } else if (data.type === 'seek') {
                                isRemoteAction = true; player.seekTo(data.time, true);
                            } else if (data.type === 'chat') {
                                addChatMessage(data.message, false, 'Host');
                            } else if (data.type === 'screen-start') {
                                // Host ekran paylaşmaya başladı, bekliyoruz
                            } else if (data.type === 'screen-stop') {
                                screenVideo.srcObject = null;
                                showYouTubeSource();
                            }
                        });
                        
                        conn.on('close', () => {
                            setConnectionStatus('Bağlantı koptu', false);
                            conn = null;
                        });
                    });
                    
                    // Gelen medya çağrısı (host ekran paylaşınca)
                    peer.on('call', (call) => {
                        call.answer();
                        call.on('stream', (remoteStream) => {
                            screenVideo.srcObject = remoteStream;
                            showScreenSource();
                        });
                        call.on('close', () => {
                            screenVideo.srcObject = null;
                            showYouTubeSource();
                        });
                        mediaCall = call;
                    });
                }
            }

            // ---------- EVENT LISTENERS ----------
            function bindEvents() {
                // Oda oluştur - DÜZGÜN ÇALIŞAN VERSİYON
                document.getElementById('createRoomBtn').addEventListener('click', function() {
                    const tempPeer = new Peer(peerOptions);
                    tempPeer.on('open', (id) => {
                        // Peer bağlantısı kuruldu, hemen sayfayı yönlendir
                        window.location.search = `?room=${id}&host=true`;
                        tempPeer.destroy(); // Yönlendirmeden sonra temizlik
                    });
                    tempPeer.on('error', (err) => {
                        console.error('Oda oluşturma hatası:', err);
                        alert('Oda oluşturulamadı. Lütfen tekrar deneyin.');
                    });
                });

                // Odaya katıl
                document.getElementById('joinRoomBtn').addEventListener('click', function() {
                    const code = prompt('Oda kodunu girin:');
                    if (code && code.trim()) {
                        window.location.search = `?room=${code.trim()}&host=false`;
                    }
                });

                // Video kontrolleri
                loadVideoBtn.addEventListener('click', () => {
                    if (!isHost || !player) return;
                    const id = extractVideoId(videoIdInput.value.trim());
                    if (id.length === 11) {
                        isRemoteAction = false;
                        player.loadVideoById(id);
                        currentVideoId = id;
                        if (conn) sendFullState();
                        showYouTubeSource();
                    }
                });

                playPauseBtn.addEventListener('click', () => {
                    if (!isHost || !player) return;
                    if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
                    else player.playVideo();
                });

                seekBackBtn.addEventListener('click', () => {
                    if (!isHost || !player) return;
                    const current = player.getCurrentTime();
                    player.seekTo(Math.max(0, current - 10), true);
                    if (conn) sendMessage({ type: 'seek', time: player.getCurrentTime() });
                });

                seekForwardBtn.addEventListener('click', () => {
                    if (!isHost || !player) return;
                    const current = player.getCurrentTime();
                    player.seekTo(current + 10, true);
                    if (conn) sendMessage({ type: 'seek', time: player.getCurrentTime() });
                });

                seekSlider.addEventListener('change', function() {
                    if (!isHost || !player) return;
                    player.seekTo(parseFloat(seekSlider.value), true);
                    if (conn) sendMessage({ type: 'seek', time: parseFloat(seekSlider.value) });
                });

                // Ekran paylaşımı
                screenShareBtn.addEventListener('click', startScreenShare);
                stopScreenShareBtn.addEventListener('click', stopScreenShare);

                // Sohbet
                sendChatBtn.addEventListener('click', sendChatMessage);
                chatInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendChatMessage();
                });

                // Floating chat
                document.getElementById('chatToggleBtn').addEventListener('click', () => {
                    document.getElementById('overlayChat').classList.toggle('hidden');
                });
                document.getElementById('closeChatBtn').addEventListener('click', () => {
                    document.getElementById('overlayChat').classList.add('hidden');
                });
            }

            // ---------- BAŞLANGIÇ ----------
            if (roomCode) {
                // Oda görünümü
                homeView.classList.add('hidden');
                roomView.classList.remove('hidden');
                roomCodeDisplay.innerText = roomCode;
                updateUIByRole();

                // YouTube API
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = 'https://www.youtube.com/iframe_api';
                    document.head.appendChild(tag);
                }
                window.onYouTubeIframeAPIReady = () => initPlayer(currentVideoId);
                if (window.YT && window.YT.Player) initPlayer(currentVideoId);

                // PeerJS başlat
                initPeerForRoom();
                bindEvents();
                
                // Varsayılan YouTube görünür
                showYouTubeSource();
                
            } else {
                // Ana sayfa
                homeView.classList.remove('hidden');
                roomView.classList.add('hidden');
            }

            // Temizlik
            window.addEventListener('beforeunload', () => {
                if (peer) peer.destroy();
                if (seekUpdateInterval) clearInterval(seekUpdateInterval);
                if (localScreenStream) localScreenStream.getTracks().forEach(t => t.stop());
            });
        })();
    </script>
</body>
</html>
