<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineParty - Birlikdə İzlə</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* --- ÜMUMİ DİZAYN (CineParty Style) --- */
    :root {
      --bg: #0a0a0f;
      --surface: #1a1a24;
      --surface-light: #252534;
      --primary: #6366f1; /* Bənövşəyi əsas rəng */
      --accent: #f59e0b;  /* Qızılı rəng */
      --success: #10b981;
      --error: #ef4444;
      --text: #ffffff;
      --text-muted: #9ca3af;
      --border: rgba(255,255,255,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- PƏRDƏ ANİMASİYASI --- */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1s, visibility 1s;
    }
    .intro-overlay.hidden { opacity: 0; visibility: hidden; }
    
    .intro-text {
      font-size: 80px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: scaleUp 1s ease forwards;
    }
    @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* --- LOBBY (GİRİŞ) EKRANI --- */
    #lobby-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a1a24 0%, #000 100%);
      z-index: 100;
      transition: transform 0.5s ease-in-out;
    }

    .lobby-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: 24px;
      width: 400px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .lobby-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--primary);
    }

    .lobby-desc {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6); }

    .btn-secondary {
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #2f2f3f; }

    input.code-input {
      width: 100%;
      padding: 16px;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 15px;
      text-align: center;
      font-size: 16px;
      outline: none;
    }
    input.code-input:focus { border-color: var(--primary); }

    /* Kod Göstərmə Sahəsi */
    .room-code-display {
      background: #111;
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 15px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 20px;
      cursor: pointer;
      margin-bottom: 20px;
      word-break: break-all;
    }
    .copy-hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

    /* --- OTAQ EKRANI (MAIN) --- */
    #room-screen {
      display: none; /* Başlanğıcda gizli */
      width: 100%;
      height: 100%;
      flex-direction: row;
    }

    /* Sol tərəf: Video */
    .video-container {
      flex: 1;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Videonun kəsilməməsi üçün */
    }

    /* Kontrol Paneli (Üzən) */
    .controls-bar {
      position: absolute;
      bottom: 30px;
      background: rgba(26, 26, 36, 0.9);
      padding: 15px 25px;
      border-radius: 50px;
      display: flex;
      gap: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      transition: opacity 0.3s;
    }
    
    /* Mouse tərpənməyəndə gizlətmək olar, hələlik sabit qalsın */
    
    .ctrl-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .ctrl-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.2); }
    .ctrl-btn.share-active { background: var(--success); box-shadow: 0 0 15px var(--success); }
    .ctrl-btn.leave { background: var(--error); }

    /* Sağ tərəf: Çat */
    .chat-sidebar {
      width: 350px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 20px;
      background: var(--surface-light);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
    }

    .message.mine {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .message.theirs {
      background: var(--surface-light);
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .sys-msg {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin: 10px 0;
    }

    .chat-input-area {
      padding: 20px;
      background: var(--surface-light);
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border);
    }

    #msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 15px;
      color: white;
      outline: none;
    }

    #send-btn {
      background: var(--primary);
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Mobil Uyğunluq */
    @media (max-width: 768px) {
      #room-screen { flex-direction: column; }
      .chat-sidebar { width: 100%; height: 40%; }
      .video-container { height: 60%; }
      .lobby-card { width: 90%; }
    }
  </style>
</head>
<body>

  <div class="intro-overlay" id="intro">
    <div class="intro-text">🎬 CineParty</div>
  </div>

  <div id="lobby-screen">
    <div class="lobby-card" id="main-menu">
      <div class="lobby-title">Xoş Gəlmisiniz!</div>
      <div class="lobby-desc">Sevgilinizlə film izləmək üçün otaq yaradın və ya mövcud otağa qoşulun.</div>
      
      <button class="btn btn-primary" onclick="showCreateUI()">
        <i class="fas fa-plus-circle"></i> Otaq Yarat
      </button>
      <button class="btn btn-secondary" onclick="showJoinUI()">
        <i class="fas fa-sign-in-alt"></i> Otağa Qoşul
      </button>
    </div>

    <div class="lobby-card" id="create-ui" style="display: none;">
      <div class="lobby-title">Otaq Yaradılır...</div>
      <div class="lobby-desc">Bu kodu sevgilinə göndər:</div>
      
      <div id="my-code-display" class="room-code-display" onclick="copyCode()">
        Yüklənir...
      </div>
      <div class="copy-hint" id="copy-status">Kopyalamaq üçün üzərinə kliklə</div>
      
      <div style="margin-top: 20px; color: var(--success); font-weight: bold; font-size: 14px;">
        <i class="fas fa-spinner fa-spin"></i> Qoşulma gözlənilir...
      </div>
      
      <button class="btn btn-secondary" onclick="backToMain()" style="margin-top: 20px;">Geri</button>
    </div>

    <div class="lobby-card" id="join-ui" style="display: none;">
      <div class="lobby-title">Otağa Qoşul</div>
      <div class="lobby-desc">Sevgilinin verdiyi kodu daxil et.</div>
      
      <input type="text" id="join-input" class="code-input" placeholder="Otaq Kodu">
      
      <button class="btn btn-primary" onclick="joinRoom()">Daxil Ol</button>
      <button class="btn btn-secondary" onclick="backToMain()">Geri</button>
    </div>
  </div>

  <div id="room-screen">
    <div class="video-container">
      <video id="remote-video" autoplay playsinline></video>
      
      <div class="controls-bar">
        <button class="ctrl-btn" id="share-btn" onclick="startScreenShare()" title="Ekran Paylaş">
          <i class="fas fa-desktop"></i>
        </button>
        <button class="ctrl-btn" id="mute-btn" onclick="toggleMute()" title="Səsi aç/bağla">
          <i class="fas fa-volume-up"></i>
        </button>
        <button class="ctrl-btn" onclick="toggleFullscreen()" title="Tam Ekran">
          <i class="fas fa-expand"></i>
        </button>
        <button class="ctrl-btn leave" onclick="location.reload()" title="Çıxış">
          <i class="fas fa-phone-slash"></i>
        </button>
      </div>
    </div>

    <div class="chat-sidebar">
      <div class="chat-header">
        <i class="fas fa-heart" style="color: var(--accent);"></i> Canlı Çat
      </div>
      <div class="chat-messages" id="messages">
        <div class="sys-msg">Otağa xoş gəldiniz! 🍿</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="msg-input" placeholder="Mesaj yaz..." onkeypress="handleEnter(event)">
        <button id="send-btn" onclick="sendMessage()">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- INTRO ---
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('intro').classList.add('hidden');
      }, 1500);
    });

    // --- MƏNTİQ (PEERJS) ---
    let peer = null;
    let conn = null;
    let myId = null;
    let localStream = null;

    // Peeri başlat
    function initPeer() {
      peer = new Peer(null, { debug: 2 });

      peer.on('open', (id) => {
        myId = id;
        console.log("My ID:", myId);
        document.getElementById('my-code-display').innerText = myId;
      });

      // Zəng gələndə (Video axını)
      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
        });
      });

      // Qoşulma olanda (Çat əlaqəsi)
      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
        enterRoomUI();
        addSystemMessage("Sevgilin qoşuldu! ❤️");
      });
    }

    initPeer();

    // --- UI NAVIGATION ---
    function showCreateUI() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('create-ui').style.display = 'block';
    }

    function showJoinUI() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('join-ui').style.display = 'block';
    }

    function backToMain() {
      document.getElementById('create-ui').style.display = 'none';
      document.getElementById('join-ui').style.display = 'none';
      document.getElementById('main-menu').style.display = 'block';
    }

    function copyCode() {
      if(myId) {
        navigator.clipboard.writeText(myId);
        const status = document.getElementById('copy-status');
        status.innerText = "Kopyalandı! ✅";
        status.style.color = "var(--success)";
        setTimeout(() => {
          status.innerText = "Kopyalamaq üçün üzərinə kliklə";
          status.style.color = "var(--text-muted)";
        }, 2000);
      }
    }

    // --- OTAQ ƏMƏLİYYATLARI ---
    function joinRoom() {
      const code = document.getElementById('join-input').value.trim();
      if (!code) return alert("Kodu daxil et!");

      conn = peer.connect(code);
      
      conn.on('open', () => {
        setupConnection();
        enterRoomUI();
        addSystemMessage("Otağa uğurla qoşuldun! 🚀");
      });

      conn.on('error', (err) => alert("Xəta: " + err));
    }

    function setupConnection() {
      conn.on('data', (data) => {
        if (data.type === 'chat') {
          addMessage(data.msg, 'theirs');
        }
      });

      conn.on('close', () => {
        alert("Əlaqə kəsildi 😢");
        location.reload();
      });
    }

    function enterRoomUI() {
      document.getElementById('lobby-screen').style.transform = 'translateY(-100%)';
      setTimeout(() => {
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('room-screen').style.display = 'flex';
      }, 500);
    }

    // --- EKRAN PAYLAŞIMI ---
    async function startScreenShare() {
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always" },
          audio: true 
        });

        // Öz ekranımızı görək (amma səssiz)
        const videoEl = document.getElementById('remote-video');
        videoEl.srcObject = localStream;
        videoEl.muted = true;

        // Qarşı tərəfə göndərək
        if (conn) {
          const call = peer.call(conn.peer, localStream);
        }

        // Paylaşım bitəndə
        localStream.getVideoTracks()[0].onended = () => {
          stopScreenShare();
        };

        document.getElementById('share-btn').classList.add('share-active');

      } catch (err) {
        console.error("Screen share error:", err);
      }
    }

    function stopScreenShare() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      document.getElementById('share-btn').classList.remove('share-active');
    }

    // --- ÇAT ---
    function sendMessage() {
      const input = document.getElementById('msg-input');
      const msg = input.value.trim();
      
      if (msg && conn && conn.open) {
        conn.send({ type: 'chat', msg: msg });
        addMessage(msg, 'mine');
        input.value = '';
      }
    }

    function addMessage(msg, type) {
      const chatBox = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.innerText = msg;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addSystemMessage(text) {
      const chatBox = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'sys-msg';
      div.innerText = text;
      chatBox.appendChild(div);
    }

    function handleEnter(e) {
      if (e.key === 'Enter') sendMessage();
    }

    // --- KONTROLLAR ---
    function toggleMute() {
      const video = document.getElementById('remote-video');
      video.muted = !video.muted;
      const btn = document.getElementById('mute-btn');
      btn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
    }

    function toggleFullscreen() {
      const elem = document.querySelector('.video-container');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
          alert(`Tam ekrana keçmək olmadı: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
