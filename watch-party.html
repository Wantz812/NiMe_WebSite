<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>🎬 Film Gecesi · TURN + Sohbet + Ekran</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- PEERJS 1.5.5 - KARARLI SÜRÜM, BAĞLANTI SORUNU YOK [citation:2] -->
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <style>
        /* ----------------------------------------------
            MODERN, RESPONSIVE, TAM EKRAN UYUMLU TASARIM
        ------------------------------------------------ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0c0f14, #030507);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .container {
            max-width: 1400px;
            width: 100%;
        }

        /* Ana Giriş Kartı */
        .home-card {
            background: rgba(18, 22, 30, 0.85);
            backdrop-filter: blur(25px);
            border-radius: 48px;
            padding: 40px 28px;
            border: 1px solid rgba(255, 138, 92, 0.2);
            box-shadow: 0 30px 50px rgba(0,0,0,0.7);
            color: white;
            max-width: 500px;
            margin: 0 auto;
        }

        .home-header {
            text-align: center;
        }

        .home-header i {
            font-size: 56px;
            color: #ff8a5c;
            background: rgba(255, 138, 92, 0.15);
            padding: 22px;
            border-radius: 30px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #ffd0b5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 36px;
        }

        .btn {
            border: none;
            padding: 18px 28px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background: #ff8a5c;
            color: #0b0e14;
        }

        .btn-outline {
            background: transparent;
            border: 1.8px solid #ff8a5c;
            color: #ff8a5c;
        }

        /* ------------- ODA GÖRÜNÜMÜ (GRID) ------------- */
        .room-card {
            background: rgba(10, 12, 18, 0.8);
            backdrop-filter: blur(25px);
            border-radius: 40px;
            padding: 28px 24px;
            border: 1px solid rgba(255,138,92,0.2);
            color: white;
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .room-code-badge {
            background: #1e1e2a;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            border: 1px solid #ff8a5c;
            color: #ff8a5c;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a1e26;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 0.95rem;
            color: #cbd5e6;
        }

        /* ANA GRID: SOL / SAĞ */
        .room-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 1000px) {
            .room-grid { grid-template-columns: 1fr; }
        }

        /* ---------- SOL TARAF: VİDEO ---------- */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* TAM EKRAN DESTEKLİ VİDEO WRAPPER */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0,0,0,0.7);
            cursor: pointer;
            transition: 0.2s;
        }
        .video-wrapper:hover {
            box-shadow: 0 0 0 2px #ff8a5c;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* FLOATING CHAT BUTTON - TAM EKRANDA YAZIŞMAK İÇİN */
        .chat-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #ff8a5c;
            color: black;
            border: none;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(255,138,92,0.5);
            cursor: pointer;
            z-index: 1000;
            transition: 0.2s;
        }
        .chat-toggle-btn:hover {
            transform: scale(1.1);
        }

        /* OVERLAY CHAT PANELİ (TAM EKRANDAYMIŞ HİSSİ) */
        .overlay-chat {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 320px;
            height: 450px;
            background: rgba(10, 12, 18, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(255,138,92,0.4);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 15px 40px black;
            z-index: 999;
            transition: 0.3s;
        }
        .overlay-chat.hidden {
            display: none;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 6px;
        }

        .message {
            background: rgba(255,255,255,0.08);
            padding: 12px 16px;
            border-radius: 22px;
            max-width: 85%;
            word-break: break-word;
            align-self: flex-start;
            color: white;
        }
        .message.own {
            background: #ff8a5c;
            color: black;
            align-self: flex-end;
        }
        .message small {
            display: block;
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 14px 20px;
            color: white;
            outline: none;
        }
        .chat-send {
            background: #ff8a5c;
            border: none;
            border-radius: 50px;
            padding: 14px 20px;
            color: black;
            cursor: pointer;
        }

        /* KONTROL PANELİ */
        .controls-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .video-id-area {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .video-id-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 60px;
            padding: 14px 22px;
            color: white;
            font-size: 1rem;
        }
        .btn-small {
            background: #ff8a5c;
            border: none;
            border-radius: 60px;
            padding: 14px 26px;
            color: black;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .control-buttons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
        }
        .control-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 14px 20px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .control-btn:hover:not(.disabled) {
            background: #ff8a5c;
            color: black;
        }
        .seek-slider {
            flex: 2;
            min-width: 180px;
            height: 6px;
            accent-color: #ff8a5c;
        }

        /* SAĞ SIDEBAR: EKRAN PAYLAŞIMI */
        .screen-sidebar {
            background: rgba(0,0,0,0.3);
            border-radius: 28px;
            padding: 22px;
            backdrop-filter: blur(12px);
        }

        .screen-video-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #0a0c10;
            border-radius: 20px;
            overflow: hidden;
            margin: 16px 0;
        }
        #screenVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
        .btn-share {
            background: #3b3f4a;
            color: white;
            width: 100%;
        }
        .btn-share.active {
            background: #ff4d4d;
        }

        .disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========== ANA SAYFA ========== -->
        <div id="homeView" class="home-card">
            <div class="home-header">
                <i class="fas fa-couch"></i>
                <h1>Film Gecesi</h1>
                <div class="subtitle" style="color:#b9c2da; margin-top:12px;">Sevgilinle uzaktan, TURN destekli kesintisiz ❤️</div>
            </div>
            <div class="btn-group">
                <button id="createRoomBtn" class="btn btn-primary">
                    <i class="fas fa-video"></i> Oda Oluştur
                </button>
                <button id="joinRoomBtn" class="btn btn-outline">
                    <i class="fas fa-door-open"></i> Odaya Katıl
                </button>
            </div>
            <div style="margin-top:28px; text-align:center; font-size:0.9rem; color:#7e8aa8;">
                <i class="fas fa-shield"></i> TURN + STUN | PeerJS 1.5.5 | Her ağda çalışır
            </div>
        </div>

        <!-- ========== ODA GÖRÜNÜMÜ ========== -->
        <div id="roomView" class="room-card hidden">
            <!-- Oda kodu ve durum -->
            <div class="room-header">
                <div class="room-code-badge">
                    <i class="fas fa-hashtag"></i> <span id="roomCodeDisplay">...</span>
                </div>
                <div id="connectionStatus" class="status">
                    <i class="fas fa-circle"></i> Bağlanıyor...
                </div>
            </div>

            <!-- GRID: SOL VİDEO / SAĞ EKRAN PAYLAŞIMI -->
            <div class="room-grid">
                <!-- SOL: YOUTUBE + KONTROLLER -->
                <div class="video-section">
                    <!-- TAM EKRAN TIKLANABİLİR VİDEO -->
                    <div id="videoWrapper" class="video-wrapper">
                        <div id="player"></div>
                    </div>

                    <div class="controls-panel">
                        <div class="video-id-area">
                            <input type="text" id="videoIdInput" class="video-id-input" placeholder="YouTube video ID (örnek: dQw4w9WgXcQ)" value="dQw4w9WgXcQ">
                            <button id="loadVideoBtn" class="btn-small"><i class="fas fa-cloud-upload-alt"></i> Yükle</button>
                        </div>
                        <div class="control-buttons">
                            <button id="seekBackBtn" class="control-btn" title="10 sn geri"><i class="fas fa-backward"></i> 10</button>
                            <button id="playPauseBtn" class="control-btn" title="Oynat/Durdur"><i class="fas fa-play"></i></button>
                            <button id="seekForwardBtn" class="control-btn" title="10 sn ileri"><i class="fas fa-forward"></i> 10</button>
                            <input type="range" id="seekSlider" class="seek-slider" min="0" value="0" step="1">
                            <span id="timeDisplay" class="time-display" style="color:#ccd6f0;">00:00 / 00:00</span>
                        </div>
                    </div>
                    <div id="roomMessage" style="color:#99a5c2; background:rgba(0,0,0,0.2); padding:14px; border-radius:50px; text-align:center;">
                        <i class="fas fa-info-circle"></i> Host değilsen kontroller pasiftir.
                    </div>
                </div>

                <!-- SAĞ: EKRAN PAYLAŞIMI -->
                <div class="screen-sidebar">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="display:flex; gap:10px;"><i class="fas fa-desktop"></i> Ekran</h3>
                        <button id="screenShareBtn" class="btn-small btn-share" style="width:auto;">
                            <i class="fas fa-share-alt"></i> Paylaş
                        </button>
                    </div>
                    <div class="screen-video-box">
                        <video id="screenVideo" autoplay playsinline muted></video>
                    </div>
                    <p id="screenShareStatus" style="font-size:0.85rem; color:#aab5cc; margin-top:12px;">
                        <i class="fas fa-info-circle"></i> Host, butona basıp ekranı seçsin.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING CHAT BUTTON + OVERLAY PANEL (HER ZAMAN ERİŞİLEBİLİR) -->
    <button id="chatToggleBtn" class="chat-toggle-btn">
        <i class="fas fa-comment"></i>
    </button>
    <div id="overlayChat" class="overlay-chat hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 style="color:white;"><i class="fas fa-comment-dots" style="color:#ff8a5c;"></i> Sohbet</h3>
            <button id="closeChatBtn" style="background:none; border:none; color:#aaa; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="message" style="background:transparent; color:#99a5c2; text-align:center;">💬 Bağlantı kurulunca mesajlar burada...</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="Mesaj yaz..." autocomplete="off">
            <button id="sendChatBtn" class="chat-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- URL Parametreleri ----------
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            const hostParam = urlParams.get('host');
            const isHost = hostParam === 'true';
            const roomCode = roomParam || '';

            // ---------- DOM ----------
            const homeView = document.getElementById('homeView');
            const roomView = document.getElementById('roomView');
            const roomCodeDisplay = document.getElementById('roomCodeDisplay');
            const connectionStatusEl = document.getElementById('connectionStatus');
            const roomMessage = document.getElementById('roomMessage');
            const videoIdInput = document.getElementById('videoIdInput');
            const loadVideoBtn = document.getElementById('loadVideoBtn');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const seekBackBtn = document.getElementById('seekBackBtn');
            const seekForwardBtn = document.getElementById('seekForwardBtn');
            const seekSlider = document.getElementById('seekSlider');
            const timeDisplay = document.getElementById('timeDisplay');
            const videoWrapper = document.getElementById('videoWrapper');
            // Sohbet
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');
            const sendChatBtn = document.getElementById('sendChatBtn');
            const chatToggleBtn = document.getElementById('chatToggleBtn');
            const overlayChat = document.getElementById('overlayChat');
            const closeChatBtn = document.getElementById('closeChatBtn');
            // Ekran
            const screenShareBtn = document.getElementById('screenShareBtn');
            const screenVideo = document.getElementById('screenVideo');
            const screenShareStatus = document.getElementById('screenShareStatus');

            // ---------- GLOBALS ----------
            let peer = null;
            let conn = null;           // DataConnection
            let mediaCall = null;      // MediaConnection (ekran)
            let player = null;
            let isPlayerReady = false;
            let isRemoteAction = false;
            let currentVideoId = 'dQw4w9WgXcQ';
            let seekUpdateInterval = null;
            let localScreenStream = null;

            // ---------- TURN + STUN CONFIG (Kritik! Farklı ağlarda bağlantı için) [citation:6][citation:7] ----------
            const iceServersConfig = {
                config: {
                    iceServers: [
                        // Google STUN (herkese açık)
                        { urls: 'stun:stun.l.google.com:19302' },
                        // OpenRelay TURN (ücretsiz, relay) - simetrik NAT için hayati
                        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
                    ],
                    sdpSemantics: 'unified-plan'
                },
                debug: 2  // hata ayıklama için, isteğe bağlı
            };

            // ---------- YARDIMCI FONKSİYONLAR ----------
            function extractVideoId(urlOrId) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = urlOrId.match(regExp);
                return (match && match[2].length === 11) ? match[2] : urlOrId;
            }

            function formatTime(seconds) {
                if (isNaN(seconds)) return '00:00';
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }

            function setConnectionStatus(text, isConnected = false) {
                if (connectionStatusEl) {
                    connectionStatusEl.innerHTML = isConnected 
                        ? `<i class="fas fa-circle" style="color:#48ca7c;"></i> ${text}`
                        : `<i class="fas fa-circle" style="color:#ffb347;"></i> ${text}`;
                }
            }

            // ---------- YETKİ GÜNCELLEME ----------
            function updateUIByRole() {
                const isViewer = !isHost;
                if (isViewer) {
                    videoIdInput.disabled = true;
                    loadVideoBtn.disabled = true;
                    playPauseBtn.disabled = true;
                    seekBackBtn.disabled = true;
                    seekForwardBtn.disabled = true;
                    seekSlider.disabled = true;
                    playPauseBtn.classList.add('disabled');
                    seekBackBtn.classList.add('disabled');
                    seekForwardBtn.classList.add('disabled');
                    screenShareBtn.disabled = true;
                    screenShareBtn.classList.add('disabled');
                    screenShareStatus.innerHTML = '<i class="fas fa-eye"></i> İzleyici: Host ekran paylaşınca görürsün.';
                } else {
                    videoIdInput.disabled = false;
                    loadVideoBtn.disabled = false;
                    playPauseBtn.disabled = false;
                    seekBackBtn.disabled = false;
                    seekForwardBtn.disabled = false;
                    seekSlider.disabled = false;
                    playPauseBtn.classList.remove('disabled');
                    seekBackBtn.classList.remove('disabled');
                    seekForwardBtn.classList.remove('disabled');
                    screenShareBtn.disabled = false;
                    screenShareBtn.classList.remove('disabled');
                    screenShareStatus.innerHTML = '<i class="fas fa-info-circle"></i> Ekranı paylaşmak için butona bas.';
                }
            }

            // ---------- VERİ GÖNDER (DataChannel) ----------
            function sendMessage(obj) {
                if (conn && conn.open) {
                    conn.send(obj);
                }
            }

            // ---------- YOUTUBE PLAYER ----------
            function initPlayer(videoId) {
                if (!window.YT) { setTimeout(() => initPlayer(videoId), 200); return; }
                if (player && player.destroy) player.destroy();
                player = new YT.Player('player', {
                    videoId: videoId,
                    playerVars: {
                        autoplay: 0, controls: 0, disablekb: 1, fs: 0,
                        modestbranding: 1, rel: 0, showinfo: 0, iv_load_policy: 3
                    },
                    events: {
                        onReady: onPlayerReady,
                        onStateChange: onPlayerStateChange,
                        onError: (e) => console.warn('YouTube hatası', e)
                    }
                });
                currentVideoId = videoId;
            }

            function onPlayerReady(event) {
                isPlayerReady = true;
                const duration = player.getDuration();
                seekSlider.max = duration || 100;
                if (isHost && conn) sendFullState();
                if (seekUpdateInterval) clearInterval(seekUpdateInterval);
                seekUpdateInterval = setInterval(() => {
                    if (player && player.getCurrentTime) {
                        const current = player.getCurrentTime();
                        const duration = player.getDuration();
                        if (!isNaN(current)) {
                            seekSlider.value = current;
                            timeDisplay.innerText = `${formatTime(current)} / ${formatTime(duration)}`;
                        }
                        playPauseBtn.innerHTML = (player.getPlayerState() === YT.PlayerState.PLAYING) 
                            ? '<i class="fas fa-pause"></i>' 
                            : '<i class="fas fa-play"></i>';
                    }
                }, 500);
            }

            function onPlayerStateChange(event) {
                if (!isRemoteAction && isHost && conn) {
                    const state = event.data;
                    if (state === YT.PlayerState.PLAYING) {
                        sendMessage({ type: 'play', time: player.getCurrentTime() });
                    } else if (state === YT.PlayerState.PAUSED) {
                        sendMessage({ type: 'pause', time: player.getCurrentTime() });
                    } else if (state === YT.PlayerState.ENDED) {
                        sendMessage({ type: 'pause', time: 0 });
                    }
                }
                isRemoteAction = false;
            }

            function sendFullState() {
                if (!player || !isPlayerReady || !conn) return;
                sendMessage({
                    type: 'sync',
                    videoId: currentVideoId,
                    time: player.getCurrentTime(),
                    playing: (player.getPlayerState() === YT.PlayerState.PLAYING)
                });
            }

            // ---------- EKRAN PAYLAŞIMI (TURN destekli) ----------
            async function startScreenShare() {
                if (!isHost) return;
                try {
                    localScreenStream = await navigator.mediaDevices.getDisplayMedia({ 
                        video: true, 
                        audio: false 
                    });
                    screenVideo.srcObject = localScreenStream;
                    screenVideo.muted = true;
                    screenShareBtn.innerHTML = '<i class="fas fa-stop-circle"></i> Paylaşımı Durdur';
                    screenShareBtn.classList.add('active');
                    screenShareStatus.innerHTML = '<i class="fas fa-share"></i> Ekran paylaşılıyor...';

                    // İzleyiciye çağrı yap (TURN konfigürasyonu peer objesinde zaten var)
                    if (conn && conn.peer) {
                        mediaCall = peer.call(conn.peer, localScreenStream);
                        mediaCall.on('close', () => {
                            console.log('Media call kapandı');
                        });
                    }

                    localScreenStream.getVideoTracks()[0].onended = () => {
                        stopScreenShare();
                    };
                } catch (err) {
                    console.error('Ekran paylaşım hatası:', err);
                    screenShareStatus.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Paylaşım başarısız.';
                }
            }

            function stopScreenShare() {
                if (localScreenStream) {
                    localScreenStream.getTracks().forEach(track => track.stop());
                    localScreenStream = null;
                }
                if (mediaCall) {
                    mediaCall.close();
                    mediaCall = null;
                }
                screenVideo.srcObject = null;
                screenShareBtn.innerHTML = '<i class="fas fa-share-alt"></i> Paylaş';
                screenShareBtn.classList.remove('active');
                screenShareStatus.innerHTML = '<i class="fas fa-info-circle"></i> Host, ekranı paylaşmak için butona bas.';
                sendMessage({ type: 'screen-stop' });
            }

            // ---------- SOHBET ----------
            function addChatMessage(text, isOwn = false, sender = 'Arkadaş') {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message');
                if (isOwn) msgDiv.classList.add('own');
                const time = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                msgDiv.innerHTML = `${text}<br><small>${isOwn ? 'Sen' : sender} • ${time}</small>`;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function sendChatMessage() {
                const msg = chatInput.value.trim();
                if (!msg) return;
                addChatMessage(msg, true, 'Sen');
                sendMessage({ type: 'chat', message: msg });
                chatInput.value = '';
            }

            // ---------- TAM EKRAN ----------
            function toggleFullScreen() {
                if (!document.fullscreenElement) {
                    videoWrapper.requestFullscreen().catch(err => {
                        console.warn('Tam ekran hatası:', err);
                    });
                } else {
                    document.exitFullscreen();
                }
            }

            // ---------- PEERJS BAŞLAT (TURN+STUN AKTİF) [citation:1][citation:7] ----------
            function initPeerForRoom() {
                if (!roomCode) return;

                if (isHost) {
                    // HOST: belirli ID ile, TURN+STUN konfigüre edilmiş
                    peer = new Peer(roomCode, iceServersConfig);
                    peer.on('open', (id) => {
                        setConnectionStatus('Host hazır, oda aktif', true);
                    });
                    peer.on('connection', (incomingConn) => {
                        conn = incomingConn;
                        conn.on('open', () => {
                            setConnectionStatus('İzleyici bağlandı!', true);
                            if (player && isPlayerReady) sendFullState();
                            addChatMessage('İzleyici odaya katıldı.', false, 'Sistem');
                        });
                        conn.on('data', (data) => {
                            if (data.type === 'requestState') {
                                sendFullState();
                            } else if (data.type === 'chat') {
                                addChatMessage(data.message, false, 'İzleyici');
                            }
                        });
                        conn.on('close', () => {
                            setConnectionStatus('İzleyici ayrıldı, bekleniyor...', false);
                            conn = null;
                        });
                    });
                    peer.on('call', (call) => {
                        // İzleyici tarafından çağrı gelmez (biz çağırıyoruz), yine de answer boş
                        call.answer();
                    });
                    peer.on('error', (err) => {
                        console.error('Peer hatası:', err);
                        setConnectionStatus('Oda alınamadı (kod dolu?)', false);
                    });
                } else {
                    // İZLEYİCİ: rastgele ID, TURN+STUN ile
                    peer = new Peer(iceServersConfig);
                    peer.on('open', (id) => {
                        setConnectionStatus('Bağlanıyor...', false);
                        conn = peer.connect(roomCode);
                        conn.on('open', () => {
                            setConnectionStatus('Host ile bağlantı kuruldu!', true);
                            conn.send({ type: 'requestState' });
                            addChatMessage('Host ile bağlantı kuruldu!', false, 'Sistem');
                        });
                        conn.on('data', (data) => {
                            if (data.type === 'sync' || data.type === 'init') {
                                if (data.videoId && data.videoId !== currentVideoId) {
                                    currentVideoId = data.videoId;
                                    videoIdInput.value = currentVideoId;
                                    if (player && player.loadVideoById) {
                                        isRemoteAction = true;
                                        player.loadVideoById(currentVideoId, data.time || 0);
                                    } else {
                                        initPlayer(currentVideoId);
                                    }
                                } else {
                                    if (data.time !== undefined && player && player.seekTo) {
                                        isRemoteAction = true; player.seekTo(data.time, true);
                                    }
                                    if (data.playing === true && player && player.playVideo) {
                                        isRemoteAction = true; player.playVideo();
                                    } else if (data.playing === false && player && player.pauseVideo) {
                                        isRemoteAction = true; player.pauseVideo();
                                    }
                                }
                            } else if (data.type === 'play') {
                                isRemoteAction = true; player.playVideo(); if(data.time) player.seekTo(data.time, true);
                            } else if (data.type === 'pause') {
                                isRemoteAction = true; player.pauseVideo(); if(data.time) player.seekTo(data.time, true);
                            } else if (data.type === 'seek') {
                                isRemoteAction = true; player.seekTo(data.time, true);
                            } else if (data.type === 'chat') {
                                addChatMessage(data.message, false, 'Host');
                            } else if (data.type === 'screen-stop') {
                                screenVideo.srcObject = null;
                                screenShareStatus.innerHTML = '<i class="fas fa-info-circle"></i> Host ekran paylaşımını durdurdu.';
                            }
                        });
                        conn.on('close', () => {
                            setConnectionStatus('Bağlantı koptu', false);
                            conn = null;
                        });
                    });

                    // Gelen medya çağrısını kabul et (host ekran paylaşınca)
                    peer.on('call', (call) => {
                        call.answer(); // stream göndermiyoruz, sadece alıyoruz
                        call.on('stream', (remoteStream) => {
                            screenVideo.srcObject = remoteStream;
                            screenShareStatus.innerHTML = '<i class="fas fa-share"></i> Host ekranı paylaşıyor...';
                        });
                        call.on('close', () => {
                            screenVideo.srcObject = null;
                            screenShareStatus.innerHTML = '<i class="fas fa-info-circle"></i> Host ekran paylaşımını durdurdu.';
                        });
                        mediaCall = call;
                    });
                }
            }

            // ---------- EVENT LISTENERS ----------
            function bindEvents() {
                // Oda oluştur / katıl
                document.getElementById('createRoomBtn').addEventListener('click', function() {
                    const tempPeer = new Peer(iceServersConfig);
                    tempPeer.on('open', (id) => {
                        tempPeer.destroy();
                        window.location.search = `?room=${id}&host=true`;
                    });
                });

                document.getElementById('joinRoomBtn').addEventListener('click', function() {
                    const code = prompt('Oluşturulan oda kodunu gir:');
                    if (code && code.trim()) {
                        window.location.search = `?room=${code.trim()}&host=false`;
                    }
                });

                // Video kontrolleri
                loadVideoBtn.addEventListener('click', () => {
                    if (!isHost) return;
                    const raw = videoIdInput.value.trim();
                    if (!raw) return;
                    const id = extractVideoId(raw);
                    if (id.length === 11) {
                        currentVideoId = id;
                        isRemoteAction = false;
                        if (player && player.loadVideoById) player.loadVideoById(id);
                        else initPlayer(id);
                        if (conn) sendFullState();
                    }
                });

                playPauseBtn.addEventListener('click', () => {
                    if (!isHost || !player || !isPlayerReady) return;
                    if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
                    else player.playVideo();
                });

                seekBackBtn.addEventListener('click', () => {
                    if (!isHost || !player) return;
                    const current = player.getCurrentTime();
                    player.seekTo(Math.max(0, current - 10), true);
                    if (conn) sendMessage({ type: 'seek', time: player.getCurrentTime() });
                });

                seekForwardBtn.addEventListener('click', () => {
                    if (!isHost || !player) return;
                    const current = player.getCurrentTime();
                    player.seekTo(current + 10, true);
                    if (conn) sendMessage({ type: 'seek', time: player.getCurrentTime() });
                });

                seekSlider.addEventListener('change', function() {
                    if (!isHost || !player) return;
                    const val = parseFloat(seekSlider.value);
                    player.seekTo(val, true);
                    if (conn) sendMessage({ type: 'seek', time: val });
                });

                // Tam ekran
                videoWrapper.addEventListener('dblclick', toggleFullScreen);

                // Sohbet
                sendChatBtn.addEventListener('click', sendChatMessage);
                chatInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendChatMessage();
                });

                // Floating chat
                chatToggleBtn.addEventListener('click', () => {
                    overlayChat.classList.toggle('hidden');
                });
                closeChatBtn.addEventListener('click', () => {
                    overlayChat.classList.add('hidden');
                });

                // Ekran paylaşımı
                screenShareBtn.addEventListener('click', function() {
                    if (!isHost) return;
                    if (localScreenStream) stopScreenShare();
                    else startScreenShare();
                });
            }

            // ---------- URL'E GÖRE BAŞLAT ----------
            if (roomCode) {
                homeView.classList.add('hidden');
                roomView.classList.remove('hidden');
                roomCodeDisplay.innerText = roomCode;
                updateUIByRole();

                // YouTube API
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = 'https://www.youtube.com/iframe_api';
                    document.head.appendChild(tag);
                }
                window.onYouTubeIframeAPIReady = function() {
                    initPlayer(currentVideoId);
                };
                if (window.YT && window.YT.Player) initPlayer(currentVideoId);

                initPeerForRoom();
                bindEvents();
            } else {
                homeView.classList.remove('hidden');
                roomView.classList.add('hidden');
            }

            // Temizlik
            window.addEventListener('beforeunload', function() {
                if (peer) peer.destroy();
                if (seekUpdateInterval) clearInterval(seekUpdateInterval);
                if (localScreenStream) localScreenStream.getTracks().forEach(t => t.stop());
            });
        })();
    </script>
</body>
</html>
