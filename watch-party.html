<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Uzaktan Film İzle · Sevgiliyle</title>
    <!-- Font Awesome Icons (v6) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0e14 0%, #1a1f2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
        }

        /* Ana kart görünümü */
        .card {
            background: rgba(18, 22, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.7);
            padding: 32px 24px;
            color: white;
            transition: all 0.2s;
        }

        /* Ana sayfa (giriş) stilleri */
        .home-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .home-header i {
            font-size: 48px;
            color: #ff8a5c;
            background: rgba(255, 138, 92, 0.2);
            padding: 20px;
            border-radius: 30px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: white;
        }

        .subtitle {
            color: #a8b3cf;
            margin-top: 8px;
            font-size: 1rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 32px;
        }

        .btn {
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background: #ff8a5c;
            color: #0b0e14;
            border: none;
        }

        .btn-primary i {
            color: #0b0e14;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(255,138,92,0.5);
            color: #ff8a5c;
        }

        .btn:hover {
            transform: scale(0.98);
            background: #ff9e77;
        }

        .btn-outline:hover {
            background: rgba(255,138,92,0.1);
        }

        /* Oda görünümü (video odası) */
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .room-code-badge {
            background: rgba(0,0,0,0.4);
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            border: 1px solid #ff8a5c;
            color: #ff8a5c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e2430;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #b9c2d9;
        }

        .status i {
            font-size: 0.8rem;
            color: #48ca7c;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #player {
            width: 100%;
            height: 100%;
        }

        .video-info {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .video-id-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .video-id-input {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 14px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .video-id-input:focus {
            border-color: #ff8a5c;
            background: rgba(255,138,92,0.1);
        }

        .video-id-input::placeholder {
            color: #7e8aa8;
        }

        .btn-small {
            padding: 14px 28px;
            border-radius: 50px;
            background: #ff8a5c;
            border: none;
            color: #0b0e14;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-small:disabled, .btn:disabled, .btn-small.disabled, .control-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 8px;
        }

        .control-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 14px 18px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 60px;
        }

        .control-btn:hover:not(.disabled) {
            background: #ff8a5c;
            color: black;
            border-color: #ff8a5c;
        }

        .seek-slider {
            flex: 2;
            min-width: 180px;
            height: 6px;
            background: rgba(255,255,255,0.16);
            border-radius: 10px;
            accent-color: #ff8a5c;
        }

        .time-display {
            font-size: 0.9rem;
            color: #ccd6f0;
            letter-spacing: 0.5px;
        }

        .conn-message {
            margin-top: 24px;
            text-align: center;
            color: #99a5c2;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 40px;
        }

        hr {
            border: 0.5px solid rgba(255,255,255,0.1);
            margin: 24px 0;
        }

        .footer-info {
            font-size: 0.8rem;
            color: #6f7a95;
            text-align: center;
        }

        /* gizle/göster */
        .hidden {
            display: none;
        }

        .toast {
            background: #ff8a5c;
            color: #0b0e14;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 500;
        }

        /* mobil ufak ayar */
        @media (max-width: 480px) {
            .card { padding: 24px 16px; }
            .room-code-badge { font-size: 1rem; padding: 10px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========== ANA SAYFA (GİRİŞ) ========== -->
        <div id="homeView" class="card">
            <div class="home-header">
                <i class="fas fa-film"></i>
                <h1>Uzaktan Film Gecesi</h1>
                <div class="subtitle">Sevgilinle senkronize izle, anı yaşa ❤️</div>
            </div>
            <div class="btn-group">
                <button id="createRoomBtn" class="btn btn-primary">
                    <i class="fas fa-video"></i> Oda Oluştur
                </button>
                <button id="joinRoomBtn" class="btn btn-outline">
                    <i class="fas fa-door-open"></i> Odaya Katıl
                </button>
            </div>
            <hr>
            <div class="footer-info">
                <i class="fas fa-shield-alt"></i> PeerJS ile uçtan uca bağlantı • Kod gir, takıl
            </div>
        </div>

        <!-- ========== ODA GÖRÜNÜMÜ (VİDEO + KONTROLLER) ========== -->
        <div id="roomView" class="card hidden">
            <!-- Üst kısım: oda kodu ve bağlantı durumu -->
            <div class="room-header">
                <div class="room-code-badge">
                    <i class="fas fa-hashtag"></i> <span id="roomCodeDisplay">...</span>
                </div>
                <div id="connectionStatus" class="status">
                    <i class="fas fa-circle"></i> Bağlantı bekleniyor...
                </div>
            </div>

            <!-- Video alanı (YouTube player) -->
            <div class="video-wrapper">
                <div id="player"></div>
            </div>

            <!-- Video ID girme / yükleme -->
            <div class="video-info">
                <div class="video-id-area">
                    <input type="text" id="videoIdInput" class="video-id-input" placeholder="YouTube video ID (örn: dQw4w9WgXcQ)" value="dQw4w9WgXcQ">
                    <button id="loadVideoBtn" class="btn-small">
                        <i class="fas fa-cloud-upload-alt"></i> Yükle
                    </button>
                </div>

                <!-- Oynatma kontrolleri -->
                <div class="controls">
                    <button id="seekBackBtn" class="control-btn" title="10 sn geri">
                        <i class="fas fa-backward"></i> 10
                    </button>
                    <button id="playPauseBtn" class="control-btn" title="Oynat/Durdur">
                        <i class="fas fa-play"></i>
                    </button>
                    <button id="seekForwardBtn" class="control-btn" title="10 sn ileri">
                        <i class="fas fa-forward"></i> 10
                    </button>
                    <input type="range" id="seekSlider" class="seek-slider" min="0" value="0" step="1">
                    <span id="timeDisplay" class="time-display">00:00 / 00:00</span>
                </div>
            </div>

            <!-- Durum mesajları / bilgi -->
            <div id="roomMessage" class="conn-message">
                <i class="fas fa-info-circle"></i> Host değilsen kontroller pasiftir, izleyici modundasın.
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- URL Parametrelerini Oku ----------
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            const hostParam = urlParams.get('host'); // 'true' veya 'false'

            const isHost = hostParam === 'true';
            const roomCode = roomParam || '';

            // ---------- DOM Elementleri ----------
            const homeView = document.getElementById('homeView');
            const roomView = document.getElementById('roomView');
            const roomCodeDisplay = document.getElementById('roomCodeDisplay');
            const connectionStatusEl = document.getElementById('connectionStatus');
            const roomMessage = document.getElementById('roomMessage');
            const videoIdInput = document.getElementById('videoIdInput');
            const loadVideoBtn = document.getElementById('loadVideoBtn');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const seekBackBtn = document.getElementById('seekBackBtn');
            const seekForwardBtn = document.getElementById('seekForwardBtn');
            const seekSlider = document.getElementById('seekSlider');
            const timeDisplay = document.getElementById('timeDisplay');

            // ---------- Global Değişkenler ----------
            let peer = null;              // PeerJS instance
            let conn = null;            // DataConnection
            let player = null;          // YouTube player
            let isPlayerReady = false;  // YouTube player API hazır mı?
            let isRemoteAction = false; // Uzaktan gelen aksiyon mu? (echo'yu engelle)
            let currentVideoId = 'dQw4w9WgXcQ'; // default Rick Astley - Never Gonna Give You Up (iyi bir sürpriz :))
            let isPlayingLocally = false;
            let seekUpdateInterval = null;

            // ---------- Yardımcı Fonksiyonlar ----------
            function extractVideoId(urlOrId) {
                // Basit regex: YouTube video ID'sini ayıkla
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = urlOrId.match(regExp);
                return (match && match[2].length === 11) ? match[2] : urlOrId;
            }

            // Zaman formatla (saniye -> mm:ss)
            function formatTime(seconds) {
                if (isNaN(seconds)) return '00:00';
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }

            // UI durumunu güncelle (host/izleyici yetkileri)
            function updateUIByRole() {
                const isViewer = !isHost;
                // İzleyici ise kontrolleri devre dışı bırak
                if (isViewer) {
                    videoIdInput.disabled = true;
                    loadVideoBtn.disabled = true;
                    playPauseBtn.disabled = true;
                    seekBackBtn.disabled = true;
                    seekForwardBtn.disabled = true;
                    seekSlider.disabled = true;
                    playPauseBtn.classList.add('disabled');
                    seekBackBtn.classList.add('disabled');
                    seekForwardBtn.classList.add('disabled');
                    roomMessage.innerHTML = '<i class="fas fa-eye"></i> İzleyici modu · Kontroller pasif, host ile senkronize izliyorsun.';
                } else {
                    videoIdInput.disabled = false;
                    loadVideoBtn.disabled = false;
                    playPauseBtn.disabled = false;
                    seekBackBtn.disabled = false;
                    seekForwardBtn.disabled = false;
                    seekSlider.disabled = false;
                    playPauseBtn.classList.remove('disabled');
                    seekBackBtn.classList.remove('disabled');
                    seekForwardBtn.classList.remove('disabled');
                    roomMessage.innerHTML = '<i class="fas fa-crown"></i> Host sensin · Videoyu sen kontrol ediyorsun.';
                }
            }

            // Bağlantı durumu mesajını güncelle
            function setConnectionStatus(text, isConnected = false) {
                if (connectionStatusEl) {
                    connectionStatusEl.innerHTML = isConnected 
                        ? '<i class="fas fa-circle" style="color:#48ca7c;"></i> ' + text
                        : '<i class="fas fa-circle" style="color:#ffb347;"></i> ' + text;
                }
            }

            // ---------- PeerJS ve Veri Gönderme ----------
            function sendMessage(obj) {
                if (conn && conn.open) {
                    conn.send(obj);
                }
            }

            // Host -> İzleyici: anlık durum gönder (videoId, süre, oynatma durumu)
            function sendFullState() {
                if (!player || !isPlayerReady || !conn) return;
                const currentTime = player.getCurrentTime();
                const state = player.getPlayerState();
                const isPlaying = (state === YT.PlayerState.PLAYING);
                sendMessage({
                    type: 'sync',
                    videoId: currentVideoId,
                    time: currentTime,
                    playing: isPlaying
                });
            }

            // ---------- YouTube Player API ----------
            function initPlayer(videoId) {
                if (!window.YT) {
                    // API henüz yüklenmediyse bekle
                    setTimeout(() => initPlayer(videoId), 200);
                    return;
                }
                if (player && player.destroy) {
                    player.destroy();
                }
                player = new YT.Player('player', {
                    videoId: videoId,
                    playerVars: {
                        autoplay: 0,
                        controls: 0,
                        disablekb: 1,
                        fs: 0,
                        modestbranding: 1,
                        rel: 0,
                        showinfo: 0,
                        iv_load_policy: 3,
                        cc_load_policy: 0
                    },
                    events: {
                        onReady: onPlayerReady,
                        onStateChange: onPlayerStateChange,
                        onError: (e) => console.warn('YouTube error', e)
                    }
                });
                currentVideoId = videoId;
            }

            function onPlayerReady(event) {
                isPlayerReady = true;
                // Video süresi ve slider max değerini ayarla
                const duration = player.getDuration();
                seekSlider.max = duration || 100;
                // Eğer host ise ve bağlantı varsa, durumu gönder
                if (isHost && conn) sendFullState();
                // Slider güncelleme döngüsü
                if (seekUpdateInterval) clearInterval(seekUpdateInterval);
                seekUpdateInterval = setInterval(() => {
                    if (player && player.getCurrentTime) {
                        const current = player.getCurrentTime();
                        const duration = player.getDuration();
                        if (!isNaN(current)) {
                            seekSlider.value = current;
                            timeDisplay.innerText = `${formatTime(current)} / ${formatTime(duration)}`;
                        }
                        // Play butonu ikonunu güncelle
                        if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            isPlayingLocally = true;
                        } else {
                            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                            isPlayingLocally = false;
                        }
                    }
                }, 500);
            }

            function onPlayerStateChange(event) {
                if (!isRemoteAction && isHost && conn) {
                    // Sadece host, kendi aksiyonlarını karşı tarafa göndersin
                    const state = event.data;
                    if (state === YT.PlayerState.PLAYING) {
                        sendMessage({ type: 'play', time: player.getCurrentTime() });
                    } else if (state === YT.PlayerState.PAUSED) {
                        sendMessage({ type: 'pause', time: player.getCurrentTime() });
                    } else if (state === YT.PlayerState.ENDED) {
                        // video bitti, durumu gönder
                        sendMessage({ type: 'pause', time: 0 });
                    }
                }
                isRemoteAction = false; // reset
            }

            // ---------- PeerJS Başlatma (Oda Görünümü) ----------
            function initPeerForRoom() {
                if (!roomCode) return;

                if (isHost) {
                    // HOST: belirli oda koduna sahip peer oluştur
                    peer = new Peer(roomCode);
                    peer.on('open', (id) => {
                        setConnectionStatus('Host olarak hazır, oda kodu: ' + id, true);
                    });
                    peer.on('connection', (incomingConn) => {
                        conn = incomingConn;
                        conn.on('open', () => {
                            setConnectionStatus('İzleyici bağlandı!', true);
                            // İzleyici bağlanınca ona mevcut durumu gönder
                            if (player && isPlayerReady) {
                                sendFullState();
                            }
                        });
                        conn.on('data', (data) => {
                            // İzleyiciden istek gelirse (opsiyonel)
                            if (data.type === 'requestState') {
                                sendFullState();
                            }
                        });
                        conn.on('close', () => {
                            setConnectionStatus('İzleyici ayrıldı, bekleniyor...', false);
                            conn = null;
                        });
                    });
                    peer.on('error', (err) => {
                        console.error('Peer hatası:', err);
                        setConnectionStatus('Oda oluşturulamadı (kod dolu mu?)', false);
                    });
                } else {
                    // İZLEYİCİ: rastgele peer oluştur ve hosta bağlan
                    peer = new Peer();
                    peer.on('open', (id) => {
                        setConnectionStatus('Bağlanıyor...', false);
                        conn = peer.connect(roomCode);
                        conn.on('open', () => {
                            setConnectionStatus('Host ile bağlantı kuruldu', true);
                            // Hosttan durum iste
                            conn.send({ type: 'requestState' });
                        });
                        conn.on('data', (data) => {
                            // Hosttan gelen veri
                            if (data.type === 'sync' || data.type === 'init') {
                                // videoId'yi güncelle, süreye git, oynat/durdur
                                if (data.videoId && data.videoId !== currentVideoId) {
                                    currentVideoId = data.videoId;
                                    videoIdInput.value = currentVideoId;
                                    if (player && player.loadVideoById) {
                                        isRemoteAction = true;
                                        player.loadVideoById(currentVideoId, data.time || 0);
                                    } else {
                                        initPlayer(currentVideoId);
                                    }
                                } else {
                                    // sadece oynat/durdur/arama
                                    if (data.time !== undefined && player && player.seekTo) {
                                        isRemoteAction = true;
                                        player.seekTo(data.time, true);
                                    }
                                    if (data.playing === true && player && player.playVideo) {
                                        isRemoteAction = true;
                                        player.playVideo();
                                    } else if (data.playing === false && player && player.pauseVideo) {
                                        isRemoteAction = true;
                                        player.pauseVideo();
                                    }
                                }
                            } else if (data.type === 'play') {
                                isRemoteAction = true;
                                if (player && player.playVideo) player.playVideo();
                                if (data.time && player && player.seekTo) player.seekTo(data.time, true);
                            } else if (data.type === 'pause') {
                                isRemoteAction = true;
                                if (player && player.pauseVideo) player.pauseVideo();
                                if (data.time && player && player.seekTo) player.seekTo(data.time, true);
                            } else if (data.type === 'seek') {
                                isRemoteAction = true;
                                if (player && player.seekTo) player.seekTo(data.time, true);
                            }
                        });
                        conn.on('close', () => {
                            setConnectionStatus('Bağlantı koptu, yeniden bağlanmaya çalış...', false);
                            conn = null;
                        });
                    });
                }
            }

            // ---------- Event Listeners (Kontroller) ----------
            function bindControls() {
                // Video yükle (sadece host)
                loadVideoBtn.addEventListener('click', () => {
                    if (!isHost) return;
                    const raw = videoIdInput.value.trim();
                    if (!raw) return;
                    const id = extractVideoId(raw);
                    if (id.length === 11) {
                        currentVideoId = id;
                        isRemoteAction = false; // kendi yüklemesi
                        if (player && player.loadVideoById) {
                            player.loadVideoById(id);
                        } else {
                            initPlayer(id);
                        }
                        // karşı tarafa bildir
                        if (conn) sendFullState();
                    }
                });

                // Oynat / Durdur (host)
                playPauseBtn.addEventListener('click', () => {
                    if (!isHost || !player || !isPlayerReady) return;
                    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                        player.pauseVideo();
                    } else {
                        player.playVideo();
                    }
                });

                // Geri 10sn
                seekBackBtn.addEventListener('click', () => {
                    if (!isHost || !player) return;
                    const current = player.getCurrentTime();
                    player.seekTo(Math.max(0, current - 10), true);
                    if (conn) sendMessage({ type: 'seek', time: player.getCurrentTime() });
                });

                // İleri 10sn
                seekForwardBtn.addEventListener('click', () => {
                    if (!isHost || !player) return;
                    const current = player.getCurrentTime();
                    player.seekTo(current + 10, true);
                    if (conn) sendMessage({ type: 'seek', time: player.getCurrentTime() });
                });

                // Slider ile arama
                seekSlider.addEventListener('input', function() {
                    if (!isHost || !player) return;
                    // canlı arama isteğe bağlı, sürükle bırakta seek yap
                });
                seekSlider.addEventListener('change', function() {
                    if (!isHost || !player) return;
                    const val = parseFloat(seekSlider.value);
                    player.seekTo(val, true);
                    if (conn) sendMessage({ type: 'seek', time: val });
                });
            }

            // ---------- Sayfa Yönlendirme (Oda oluştur / Katıl) ----------
            document.getElementById('createRoomBtn').addEventListener('click', function() {
                // Host: rastgele peer oluştur, ID'sini alıp odayı kur
                const tempPeer = new Peer();
                tempPeer.on('open', (id) => {
                    tempPeer.destroy(); // hemen kapat, yeni sayfada host olarak açacağız
                    window.location.search = `?room=${id}&host=true`;
                });
            });

            document.getElementById('joinRoomBtn').addEventListener('click', function() {
                const code = prompt('Oluşturulan oda kodunu gir:');
                if (code && code.trim()) {
                    window.location.search = `?room=${code.trim()}&host=false`;
                }
            });

            // ---------- URL'e göre doğru view'i göster ----------
            if (roomCode) {
                // Oda görünümünü aç
                homeView.classList.add('hidden');
                roomView.classList.remove('hidden');
                roomCodeDisplay.innerText = roomCode;
                updateUIByRole();

                // YouTube API'sini yükle
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = 'https://www.youtube.com/iframe_api';
                    const firstScriptTag = document.getElementsByTagName('script')[0];
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                }

                // YouTube API hazır olunca oynatıcıyı başlat
                window.onYouTubeIframeAPIReady = function() {
                    initPlayer(currentVideoId);
                };

                // Eğer API çoktan yüklendiyse manuel başlat
                if (window.YT && window.YT.Player) {
                    initPlayer(currentVideoId);
                }

                // PeerJS başlat
                initPeerForRoom();
                bindControls();

                // Slider max değeri için periyodik güncelleme (player hazır değilse)
            } else {
                // Ana sayfa görünüyor zaten
                homeView.classList.remove('hidden');
                roomView.classList.add('hidden');
            }

            // ---------- Sayfadan ayrılırken peer'ı temizle ----------
            window.addEventListener('beforeunload', function() {
                if (peer) peer.destroy();
                if (seekUpdateInterval) clearInterval(seekUpdateInterval);
            });

        })();
    </script>
</body>
</html>
